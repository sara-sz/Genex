              except S.SubdomainMappingError:
                  pass
              else:
                  raise AssertionError(f"did not fail closed on {bad!r}")

          print("PARENT-0.2 contract OK:", counts, "total", sum(counts.values()))
          PY

      - name: Migration determinism + protected columns
        run: |
          python - <<'PY'
          import sys, pathlib, tempfile
          sys.path.insert(0, ".")
          from parent_taxonomy import migrate as M

          SRC = pathlib.Path(
              "data/cdc_milestones_with_bridges_family_cleaned_final_app_ready.xlsx"
          )
          before = M.sha256_of(SRC)
          with tempfile.TemporaryDirectory() as td:
              cand = pathlib.Path(td) / "candidate.xlsx"
              report = M.migrate(SRC, cand)
              assert report.source_rows == report.candidate_rows == 369
              assert report.protected_columns_identical is True
              assert M.verify_candidate(SRC, cand) is True
          assert M.sha256_of(SRC) == before == M.SOURCE_SHA256, "source mutated"
          print("migration OK: 369 -> 369, 10 protected columns identical, source intact")
          PY

  app-consumers:
    name: Parent 2.4 app-consumer gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genex-parent

    # Deliberately a SEPARATE job, not extra steps on `taxonomy`.
    #
    # `taxonomy` gates the Brain and installs only pytest/pandas/openpyxl. These
    # tests exercise the FastAPI app, so they need fastapi/firebase-admin/httpx —
    # which must never enter that job. Bolting them on is exactly what broke the
    # first PARENT-0.3C freeze run: the app step failed on a missing import and,
    # being sequential, SKIPPED the regression and provenance gates behind it.
    #
    # Isolating them means a FastAPI/Firebase environment problem can no longer
    # prevent the pure Brain and regression gates from running. Both jobs must be
    # green for the freeze; neither can mask the other.
    #
    # Test-only. No GCP/Firebase auth, no secrets, no deploy, no real data —
    # firebase_admin token verification is monkeypatched by the tests themselves.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app-consumer CI dependencies
        # Exact pins with documented provenance — see the header of
        # requirements-parent24-app-ci.txt. The production manifests
        # (requirements.txt, requirements.api.txt) are NOT modified.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parent24-app-ci.txt
          pip list

      - name: Python compilation (api package + app-consumer tests)
        run: |
          python -m compileall -q api \
            tests/test_beta_access.py \
            tests/test_checkin_readiness.py \
            tests/test_parent_24_baseline_api.py \
            tests/test_parent_24_baseline_projection.py

      - name: Parent 2.4 functional baseline — product path (own pytest process)
        # 0.5F-A1. In THIS job rather than the dependency-pure taxonomy job
        # because it drives the real app through TestClient, which needs
        # fastapi, httpx and firebase-admin — exactly what
        # requirements-parent24-app-ci.txt already installs.
        #
        # Its own process, for the same reason the two steps below have theirs:
        # these suites reassign the global firebase_admin verify_id_token at
        # import time with incompatible fake-token maps, so whichever imports
        # last wins and the others get 401.
        run: python -m pytest tests/test_parent_24_baseline_api.py -q

      - name: Parent 2.4 baseline PROJECTION (own pytest process)
        # 0.5F-A2 Parent side: the pairing guard, the seven-field payload, the
        # trigger route, and the property families depend on — finalizing a
        # baseline does not require the Pilot to be reachable.
        #
        # This step also carries the CROSS-SYSTEM digest check: the test
        # imports the Pilot's `canonical_source_digest` and asserts both sides
        # agree byte for byte. If they ever diverged, every projection would
        # become an integrity conflict — loud, but useless.
        #
        # Own process, like the two suites below: these reassign the global
        # firebase_admin verify_id_token at import time with incompatible
        # fake-token maps.
        run: python -m pytest tests/test_parent_24_baseline_projection.py -q

      - name: Parent 2.4 session HANDOFF mint (own pytest process)
        # 0.5F-A3 Parent side: the pairing guard, the 256-bit token, the
        # three-field registration payload, and the mint route whose ownership
        # proof is `_require_session`.
        #
        # This step also carries the CROSS-SYSTEM digest check: the test imports
        # the Pilot's `claim_digest` and `CLAIM_DIGEST_DOMAIN` and asserts both
        # sides agree byte for byte. If they diverged, every minted capability
        # would be unredeemable.
        #
        # The module is named *session_handoff* rather than *session_claim*
        # because `test_parent_24_integrity.py` bans a Parent module whose
        # filename contains "claim" — in the Parent/RTM vocabulary a CLAIM is a
        # BILLING claim, and that guard must not be widened to admit this one.
        #
        # Own process, like the suites around it: these reassign the global
        # firebase_admin verify_id_token at import time with incompatible
        # fake-token maps.
        run: python -m pytest tests/test_parent_24_session_handoff.py -q

      - name: The functional baseline engine is NOT test-only
        # The regression this slice exists to prevent recurring.
        #
        # Before 0.5F-A1, genex_core/functional_baseline.py was imported by
        # exactly two files in the repository — itself and its own unit test —
        # so a frozen, correct engine was completely unreachable and no real
        # session could carry a baseline. No ordinary test catches that: every
        # test of the engine passed the whole time.
        #
        # This counts PRODUCTION importers over the AST and fails if the count
        # returns to zero. Deleting the API module, or quietly reverting the
        # wiring, breaks the build here rather than going unnoticed.
        run: |
          python - <<'PY'
          import ast, pathlib

          TARGET = "genex_core.functional_baseline"
          production = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              parts = path.parts
              if "tests" in parts or "__pycache__" in parts:
                  continue
              if path.as_posix().endswith("genex_core/functional_baseline.py"):
                  continue
              try:
                  tree = ast.parse(path.read_text())
              except (SyntaxError, UnicodeDecodeError):
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module == TARGET:
                      production.append(path.as_posix())
                      break
                  if isinstance(node, ast.Import) and any(
                          a.name == TARGET for a in node.names):
                      production.append(path.as_posix())
                      break

          assert production, (
              "genex_core/functional_baseline.py has NO production importer — "
              "the engine is unreachable again and no session can carry a "
              "baseline")
          assert any(p.startswith("api/") for p in production), (
              f"no api/ module imports the baseline engine: {production}")
          print("production importers of the baseline engine:")
          for path in production:
              print("  ", path)
          PY

      - name: Beta access consumer (own pytest process)
        # SEPARATE INVOCATION, deliberately. This suite and
        # test_checkin_readiness both reassign the global
        # firebase_admin.auth.verify_id_token at IMPORT time with incompatible
        # fake-token maps, so whichever is imported last wins and the other gets
        # 401. Pre-existing test-harness debt, unrelated to domain vocabulary and
        # untouched by 0.3C. Running one suite per process CONTAINS it; it is not
        # a fix, and the collision stays recorded as debt.
        run: python -m pytest tests/test_beta_access.py -q

      - name: Check-in readiness consumer (own pytest process)
        # Second, independent process — see the note above.
        run: python -m pytest tests/test_checkin_readiness.py -q

  pilot-integration:
    name: October pilot PRE-PHI integration gate
    runs-on: ubuntu-latest

    # A THIRD separate job, for the same reason `app-consumers` is a second one.
    #
    # `taxonomy` runs the 296 pilot_backend security tests and installs only
    # pytest/pandas/openpyxl. Those tests assert STRUCTURALLY that pilot_backend
    # imports no auth SDK and no database driver — an assertion that proves
    # nothing in a job where firebase-admin and google-cloud-firestore are
    # installed. So the SDKs live here, with pilot_runtime, and never there.
    #
    # Sequential steps mean a failure skips everything behind it, which is how
    # the first 0.3C freeze run produced a green-looking skip. Isolation means an
    # SDK or emulator problem cannot prevent the Brain, regression and
    # app-consumer gates from running. All three jobs must be green to freeze.
    #
    # NO CREDENTIALS. The Firestore emulator authenticates nothing, the project
    # id is a fictional `demo-` name that is not a resolvable real project, and
    # no GCP/Firebase auth step exists. No deploy, no provisioning, no real data.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 21
        # The Firestore emulator is a Java program, and the current emulator
        # build REQUIRES a Java 21+ JRE — it refuses to start on 17 with:
        #   "The java executable on your PATH is not a Java 21+ JRE."
        # Pinned to a distribution and major version so the emulator runtime
        # is reproducible; 21 is the minimum the emulator accepts rather than
        # the newest available, so this pin moves only when Google's floor does.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up gcloud
        # Google's official action, used WITHOUT any auth step — the emulator
        # needs no credentials. Used rather than relying on gcloud being
        # preinstalled on the runner image, which is an image detail that can
        # change without notice and would fail this job on a Tuesday.
        uses: google-github-actions/setup-gcloud@v2

      - name: Install the Firestore emulator
        # Official Google tooling. No credentials, no project, no network
        # access to any real GCP resource.
        run: |
          gcloud --version
          gcloud components install cloud-firestore-emulator --quiet
          java -version

      - name: Install PRE-PHI integration dependencies
        # Exact pins with documented provenance — see the header of
        # pilot_runtime/requirements-integration-ci.txt. Production manifests
        # are NOT modified.
        run: |
          python -m pip install --upgrade pip
          pip install -r pilot_runtime/requirements-integration-ci.txt
          pip list

      - name: Python compilation (pilot_runtime)
        run: python -m compileall -q pilot_runtime

      - name: Structural guard — pilot_backend still imports no SDK
        # The whole reason this job exists. Re-asserted HERE, in the job where
        # the SDKs ARE installed, so the separation is proven under the
        # conditions that could break it rather than only where it is trivially
        # true.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          banned = {
              "firebase_admin", "firebase", "google", "googleapiclient",
              "requests", "httpx", "urllib3", "aiohttp",
              "firestore", "sqlalchemy", "psycopg2", "pymongo", "redis", "boto3",
          }
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend").rglob("*.py")):
              if path.name.startswith("test_"):
                  continue
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".")[0] in banned:
                              offenders.append((str(path), alias.name))
                  if isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      if node.module.split(".")[0] in banned:
                          offenders.append((str(path), node.module))
          assert not offenders, f"pilot_backend imported an SDK: {offenders}"
          import firebase_admin, google.cloud.firestore  # noqa: F401
          print("SDKs are installed in this job, and pilot_backend still imports none")
          PY

      - name: Firebase Admin adapter (unit)
        run: python -m pytest pilot_runtime/tests/test_firebase_adapter.py -q

      - name: October pilot 0.5F-A2 — projection identity + artifact separation
        # In the INTEGRATION job because the projection entrypoint constructs a
        # Firestore store, which needs the cloud SDK. It deliberately does NOT
        # need firebase-admin — one of the tests proves the import graph is
        # Firebase-free, which is what makes the projection image (which omits
        # that SDK) able to start at all.
        run: |
          if [ -f pilot_runtime/tests/test_projection_service.py ]; then
            python -m pytest pilot_runtime/tests/test_projection_service.py -q
          else
            echo "0.5F-A2 not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5F-A3 — bootstrap identity + artifact separation
        # In the INTEGRATION job for the same reason as the A2 step above: the
        # bootstrap entrypoint constructs a Firestore store, which needs the
        # cloud SDK. It deliberately does NOT need firebase-admin — a test
        # proves the import graph is Firebase-free, which is what lets the
        # bootstrap image (which omits that SDK) start at all.
        #
        # This suite also pins the CLARIFICATION-1 distinction: the IAM boundary
        # (two `datastore.entities.*` permissions, DATABASE-scoped because
        # Firestore server-side IAM is not per-collection) versus the
        # application boundary (one repository reached, asserted empirically
        # against a recording store).
        run: |
          if [ -f pilot_runtime/tests/test_bootstrap_service.py ]; then
            python -m pytest pilot_runtime/tests/test_bootstrap_service.py -q
          else
            echo "0.5F-A3 not present on this branch — nothing to run"
          fi

      - name: 0.5F-A3 capability contention against the REAL emulator
        # The ONLY place the single-use guarantee can be proved. The
        # pilot_backend suite runs this service code over a plain dict, which is
        # not thread-safe, so every CONTENTION claim is made here:
        # eight simultaneous redemptions of one capability must leave exactly
        # one child, one link, one connection and zero orphans.
        #
        # A `consumed` boolean would be a read-then-write guard and would let
        # several through — the same shape as the defect that once produced
        # eight canonical children with eight active caregiver relationships.
        run: |
          if [ -f pilot_runtime/tests/integration/test_session_claim_emulator.py ]; then
            python -m pytest \
              pilot_runtime/tests/integration/test_session_claim_emulator.py -q
          else
            echo "0.5F-A3 not present on this branch — nothing to run"
          fi

      - name: Firestore adapter (unit, fake client)
        run: python -m pytest pilot_runtime/tests/test_firestore_adapter.py -q

      - name: 0.5A Parent GCS session adapter (unit, fake client)
        # The READ-ONLY boundary onto Parent 2.3's `sessions/{uid}/{id}.json`.
        # Driven through a fake implementing the storage surface the adapter
        # touches, with documents shaped like real Parent sessions — including
        # the clinical fields — using FICTIONAL sentinels, so "no clinical
        # content crosses the boundary" is proven rather than asserted.
        run: |
          if [ -f pilot_runtime/tests/test_parent_gcs_adapter.py ]; then
            python -m pytest pilot_runtime/tests/test_parent_gcs_adapter.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: 0.5A Parent adapter writes nothing and enumerates nothing
        # Parent is the system of record for session data and the pilot must
        # never write it. Gated structurally: the capability must be absent,
        # not merely unused. `list_blobs` is banned too — an adapter that could
        # enumerate a prefix would be an oracle for which sessions exist.
        run: |
          if [ ! -f pilot_runtime/integration/parent_gcs_source.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          path = pathlib.Path("pilot_runtime/integration/parent_gcs_source.py")
          tree = ast.parse(path.read_text())
          called = {n.func.attr for n in ast.walk(tree)
                    if isinstance(n, ast.Call)
                    and isinstance(n.func, ast.Attribute)}
          banned = {"upload_from_string", "upload_from_file",
                    "upload_from_filename", "delete", "patch", "copy_blob",
                    "rewrite", "compose", "make_public", "create_bucket",
                    "list_blobs", "list_buckets"}
          present = sorted(called & banned)
          if present:
              print("the Parent adapter can mutate or enumerate:", present)
              sys.exit(1)

          operations = sorted(n.name for n in ast.walk(tree)
                              if isinstance(n, ast.FunctionDef)
                              and not n.name.startswith("_")
                              and any(isinstance(p, ast.ClassDef)
                                      for p in ast.walk(tree)))
          # Exactly one public method on the adapter class, and it is a read.
          cls = next(n for n in ast.walk(tree)
                     if isinstance(n, ast.ClassDef)
                     and n.name == "GcsParentSessionSource")
          public = sorted(n.name for n in cls.body
                          if isinstance(n, ast.FunctionDef)
                          and not n.name.startswith("_"))
          if public != ["fetch_session_facts"]:
              print("the Parent adapter gained an operation:", public)
              sys.exit(1)

          # No logger and no print: a session id must not reach a log line.
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.add((node.module or "").split(".")[0])
          if "logging" in imported:
              print("the Parent adapter constructs a logger")
              sys.exit(1)
          if "print" in {n.func.id for n in ast.walk(tree)
                         if isinstance(n, ast.Call)
                         and isinstance(n.func, ast.Name)}:
              print("the Parent adapter prints")
              sys.exit(1)

          # And Parent's own /tmp fallback is NOT mirrored: a pilot silently
          # reading sessions from local disk would be a different system of
          # record, which is an open decision in SECURITY.md.
          for module in ("pathlib", "tempfile", "shutil"):
              if module in imported:
                  print("the Parent adapter can reach local disk:", module)
                  sys.exit(1)
          print("Parent adapter: one read operation, no write, no listing, no log, no local fallback")
          PY

      - name: 0.5A ParentSessionFacts carries identity only
        # Two fields. There is nowhere for a diagnosis, concern, plan, note,
        # answer or feedback entry to go even if a later edit tried to carry
        # one — which is the structural half of "no clinical bridge in 0.5A".
        run: |
          if [ ! -f pilot_backend/integration/parent_source.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.integration.parent_source import (
              ParentSessionFacts, ParentSessionSource)

          fields = set(ParentSessionFacts.__dataclass_fields__)
          if fields != {"session_id", "owner_uid"}:
              print("the Parent boundary widened:", sorted(fields))
              sys.exit(1)
          operations = [n for n in dir(ParentSessionSource)
                        if not n.startswith("_")]
          if operations != ["fetch_session_facts"]:
              print("the Parent port gained an operation:", operations)
              sys.exit(1)
          for forbidden in ("save", "write", "update", "delete", "create",
                            "put", "set", "patch"):
              if hasattr(ParentSessionSource, forbidden):
                  print("the Parent port can write:", forbidden)
                  sys.exit(1)
          print("ParentSessionFacts: session_id and owner_uid; the port cannot write")
          PY

      - name: Composition root
        run: python -m pytest pilot_runtime/tests/test_composition.py -q

      - name: Firestore emulator integration (REAL adapter)
        # Must EXECUTE. The suite's fixture RAISES rather than skipping when
        # the emulator is unavailable, so an absent emulator fails this job
        # instead of quietly producing a green run. A skipped emulator suite
        # is not a pass.
        run: python -m pytest pilot_runtime/tests/integration/test_firestore_emulator.py -q

      - name: Fictional PRE-PHI end-to-end (HTTP + Firestore + audit + revisions)
        run: python -m pytest pilot_runtime/tests/integration/test_e2e_pre_phi.py -q

      - name: Longitudinal identity — REAL emulator, REAL concurrency
        # The concurrency assertions here are the reason 0.4A exists. They
        # cannot run against the fake store: it is a plain dict and is not
        # thread-safe, so competing writers would prove nothing about
        # Firestore. An earlier claim-generation design passed every fake
        # test and was caught by this suite on its first real run.
        run: python -m pytest pilot_runtime/tests/integration/test_identity_emulator.py -q

      - name: Goals and monthly plans — REAL emulator, REAL concurrency
        # Two activations of the same child-month racing on a real server.
        # The same reasoning as 0.4A: the fake cannot host a race, so the
        # child-month claim is only ever proven here. Also carries the
        # activation crash-consistency fault injection — the transaction is
        # all-or-nothing and the boundary after it is forward-recoverable.
        run: python -m pytest pilot_runtime/tests/integration/test_goals_emulator.py -q

      - name: Weekly allocation and adaptation — REAL emulator, REAL concurrency
        # Two races a fake cannot host: eight threads creating cycle 1 of one
        # month, and eight allocating one cycle. Also the allocation
        # crash-consistency fault injection — every write there is a `create`,
        # so unlike 0.4C activation the whole thing is one transaction with no
        # boundary to recover across, and a crash must persist nothing.
        run: python -m pytest pilot_runtime/tests/integration/test_weekly_emulator.py -q

      - name: RTM evidence and reporting — REAL emulator, REAL concurrency
        # The period claim under genuine contention, and fault injection
        # inside the claim+record transaction. Also the suite that caught the
        # nested-array defect: Firestore refuses arrays of arrays and
        # FakeDocumentStore does not, so seven record types passed every unit
        # test while being unable to persist to a real database.
        run: python -m pytest pilot_runtime/tests/integration/test_rtm_emulator.py -q

      - name: 0.5A auth-subject uniqueness and the Parent bridge (real emulator)
        # Every CONTENTION claim 0.5A makes is made here and only here —
        # `FakeDocumentStore` is a plain dict and settles nothing about racing
        # writers. Eight-way new-subject bootstrap, eight-way legacy backfill,
        # ambiguity and provider-held refusal under contention, three fault
        # injections plus a combined fault+contention case.
        #
        # Also the suite that caught the orphan-child defect: an earlier
        # revision created the Child and the caregiver relationship before
        # acquiring the 0.4A source-link claim, so eight concurrent links left
        # seven orphan children with ACTIVE relationships — all eight visible
        # in /pilot/me/children. Every unit test passed throughout.
        run: |
          if [ -f pilot_runtime/tests/integration/test_identity_bridge_emulator.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_identity_bridge_emulator.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: 0.5B provider connections and the cascade (real emulator)
        # Every CONTENTION claim 0.5B makes is made here and only here. Also
        # the suite that caught three Firestore rules the fake store permits:
        # `set()` is unavailable in a transaction, all reads must precede all
        # writes, and conflict detection covers only documents THIS
        # transaction read — the last of which made an atomic cascade still
        # lose a race it never read.
        run: |
          if [ -f pilot_runtime/tests/integration/test_provider_connection_emulator.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_provider_connection_emulator.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: 0.5C goal + first version are one transaction (real emulator)
        # PRE-PHI blocker 3. Fault injection at BOTH ends of the transaction,
        # the caregiver path, eight-way concurrency, a crash among concurrent
        # writers, immutability after revision, and authorization unchanged.
        run: |
          if [ -f pilot_runtime/tests/integration/test_goal_atomicity_emulator.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_goal_atomicity_emulator.py -q
          else
            echo "0.5C not present on this branch — nothing to run"
          fi

      - name: 0.5B stale-assignment race, FORCED interleaving
        # The eight-thread suite above races and asserts; this one DECIDES the
        # ordering. A one-shot barrier injected at the transaction boundary
        # through the service's own `repos_factory` seam forces the two
        # orderings that expose an assignment lookup outside the transaction,
        # and an assign that does not re-read the connection inside its own.
        #
        # Both of those mutations survived the probabilistic suite. They fail
        # this one deterministically — verified by applying each and observing
        # the same single failure on repeated runs — and the unmutated
        # implementation passes with identical timing run to run.
        #
        # Production contains no sleeps and no test mode; a test in this file
        # asserts that over the AST of `pilot_backend`.
        run: |
          if [ -f pilot_runtime/tests/integration/test_connection_race_determinism.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_connection_race_determinism.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: 0.5B emulator harness leaks no process
        # Infrastructure, not product. The emulator wrapper exec-spawns a JVM
        # that `terminate()` orphaned, and 98 of them had accumulated by 0.5A.
        # Source-level guard so the fast lane catches a revert too.
        run: |
          if [ -f pilot_runtime/tests/test_emulator_lifecycle.py ]; then
            python -m pytest pilot_runtime/tests/test_emulator_lifecycle.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: Prove the emulator suites actually ran
        # Belt and braces against the one failure mode this job exists to
        # prevent: a green result produced by tests that never executed.
        # `--collect-only` counts them, and the run fails if the count is zero
        # or if any test reports as skipped.
        run: |
          python - <<'PY'
          import subprocess, sys
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "pilot_runtime/tests/integration",
               "--collect-only", "-q"],
              capture_output=True, text=True)
          count = collected.stdout.count("::")
          # Raised 70 -> 90 by 0.4B/C, 90 -> 100 by 0.4D/E, 100 -> 110 by
          # 0.4F/G, 110 -> 130 by 0.5A, 130 -> 156 by 0.5B, and 156 -> 164 by
          # 0.5C (which adds the 8 blocker-3 atomicity tests; local collection
          # is 169). A floor that never moves stops noticing when a suite
          # silently stops being collected.
          assert count >= 164, f"expected the integration suites to collect >=164 tests, got {count}"
          run = subprocess.run(
              [sys.executable, "-m", "pytest", "pilot_runtime/tests/integration",
               "-q", "-rs"],
              capture_output=True, text=True)
          sys.stdout.write(run.stdout[-3000:])
          assert run.returncode == 0, "integration suites failed"
          assert " skipped" not in run.stdout, "no integration test may be skipped"
          print(f"integration suites executed {count} tests, zero skipped")
          PY

  pilot-generation-image:
    name: October pilot 0.5E-B generation artifact
    runs-on: ubuntu-latest

    # A SEPARATE job, and the narrowest one that can prove what it claims.
    #
    # 0.5E-B introduced a second container image — the offline generation job
    # that carries the Parent workbook — and the local machine that authored it
    # had no container runtime, so its in-build assertions had never executed.
    # Nothing else in this workflow builds a container: before this job the
    # repository had zero `docker build` steps, so the artifact was unproven.
    #
    # It is a separate job rather than extra steps on an existing one because
    # it needs no Python dependencies, no emulator and no Parent CI
    # requirements — only Docker. Bolting it onto the taxonomy job would make
    # a content gate depend on a container toolchain for no reason, and it
    # runs in parallel here.
    #
    # It does NOT publish. There is no registry login, no push, and no
    # credential in this job: the image is built, inspected, run locally and
    # discarded.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the narrowed generation build context
        # The central point of this job. `docker build` honours `.dockerignore`
        # and knows nothing about `gcloudignore-generation`, so building from
        # the repository root would prove the Dockerfile compiles but NOT that
        # the approved narrow context is sufficient — the two most likely
        # failures (a path missing from the allowlist, or the image silently
        # depending on something outside it) would both pass.
        #
        # So the context is staged from the allowlist ITSELF, parsed out of
        # `gcloudignore-generation` rather than restated here. A path the
        # allowlist forgets is absent from the stage, and the build fails.
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib, shutil

          ignore = pathlib.Path(
              "pilot_runtime/deploy/gcloudignore-generation").read_text()
          admitted = []
          for line in ignore.splitlines():
              line = line.strip()
              if line.startswith("!") and not line.endswith("**"):
                  path = line[1:].rstrip("/")
                  if path:
                      admitted.append(path)
          assert admitted, "parsed no allowlist entries from the ignore file"

          # gcloudignore requires a parent directory to be un-ignored before
          # anything under it can be, so the allowlist necessarily contains
          # CONTAINER entries: `genex-parent/` and `genex-parent/data/` exist
          # only to admit their children. Copying those wholesale would drag in
          # the Parent FastAPI service, the frontend and every other workbook.
          # Keep only the deepest entries — a path that is a proper prefix of
          # another is a container, not a payload.
          admitted = [p for p in admitted
                      if not any(q != p and q.startswith(p + "/")
                                 for q in admitted)]
          print("allowlist admits (containers pruned):", admitted)
          assert "genex-parent" not in admitted, \
              "the Parent root must never be staged wholesale"

          stage = pathlib.Path("/tmp/genctx")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          def drop(_root, names):
              return [n for n in names
                      if n in ("__pycache__", "tests", "fixtures")]

          for rel in admitted:
              src = pathlib.Path(rel)
              if not src.exists():
                  continue
              dst = stage / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              if src.is_dir():
                  if dst.exists():
                      continue
                  shutil.copytree(src, dst, ignore=drop)
              else:
                  shutil.copy2(src, dst)

          # The Dockerfile and its requirements are referenced by path from
          # inside the context, so they must be present in the stage. They
          # live under pilot_runtime/, which the allowlist admits.
          for required in (
              "pilot_runtime/deploy/Dockerfile.generation",
              "pilot_runtime/deploy/requirements-generation.txt",
              "pilot_backend/integration/gold_standard_source.py",
              "pilot_runtime/integration/parent_gold_standard_source.py",
              "genex-parent/parent_taxonomy/activity_families.py",
              "genex-parent/genex_core/milestones.py",
              "genex-parent/genex_core/functional_baseline.py",
              "genex-parent/data/parent_2_4/activity_family_taxonomy_v1.xlsx",
              "genex-parent/data/parent_2_4/cdc_milestones_parent_2_4_candidate.xlsx",
          ):
              assert (stage / required).is_file(), f"missing from stage: {required}"

          # And the context must contain NOTHING ELSE from genex-parent. This
          # is the over-broad direction: an allowlist that admitted the Parent
          # service would build fine and be wrong.
          for forbidden in ("genex-parent/api", "genex-parent/webapp",
                            "genex-parent/tests", "genex-parent/notebooks",
                            "genex-parent/requirements.txt"):
              assert not (stage / forbidden).exists(), \
                  f"forbidden path reached the context: {forbidden}"

          # The frozen c2b6735d provenance snapshot lives at the data ROOT and
          # is not read by the generation path. It must not be bundled.
          root_data = stage / "genex-parent" / "data"
          stray = [p.name for p in root_data.iterdir() if p.is_file()] \
              if root_data.is_dir() else []
          assert stray == [], f"unexpected files at genex-parent/data: {stray}"

          top = sorted(p.name for p in stage.iterdir())
          assert top == ["genex-parent", "pilot_backend", "pilot_runtime"], top
          print("staged context top level:", top)
          PY

      - name: Build the generation image from the narrowed context
        # The Dockerfile runs its own assertions during the build — openai and
        # gunicorn absent, no genex-parent/api or webapp, both workbooks
        # present, and the bridge resolving 17 mappable SLP rungs. A failure in
        # any of them fails THIS step, which is the independent proof the local
        # machine could not produce.
        working-directory: .
        run: |
          docker build \
            --file /tmp/genctx/pilot_runtime/deploy/Dockerfile.generation \
            --tag pilot-generation:ci \
            /tmp/genctx

      - name: The built image carries the workbook deps and no model client
        # Re-asserted from OUTSIDE the build, against the finished artifact.
        # The in-build checks could be edited out of the Dockerfile in the same
        # commit that broke them; this step reads the image instead.
        run: |
          docker run --rm pilot-generation:ci python -c "
          import importlib.util as u
          import pandas, openpyxl
          print('pandas', pandas.__version__, '| openpyxl', openpyxl.__version__)
          assert u.find_spec('openai') is None, 'openai present in the image'
          assert u.find_spec('gunicorn') is None, 'gunicorn present in the image'
          import firebase_admin, google.cloud.firestore
          print('firestore SDK present, model client and web server absent')
          "

      - name: The adapter imports and resolves the canonical rung IN the image
        # The end-to-end claim: the bundled Parent workbook and taxonomy, read
        # inside the built artifact, reproduce the EXACT canonical identity of
        # the anchor a clinician already approved through the Therapist UI in
        # fictional staging. If the bundled content differed in any byte that
        # mattered, these refs would not match.
        run: |
          docker run --rm pilot-generation:ci python -c "
          import pathlib
          from pilot_runtime.integration.parent_gold_standard_source import (
              ParentGoldStandardSource)
          from pilot_backend.integration.gold_standard_source import RungTarget

          source = ParentGoldStandardSource(
              parent_root=pathlib.Path('/app/genex-parent'))
          rungs = source.mappable_rungs_for_domain('talking_and_communicating')
          assert len(rungs) == 17, len(rungs)

          rung = source.rung_for_target(RungTarget(
              'talking_and_communicating', 30, 'says about 50 words'))
          assert rung.rung_ref == 'rung1:9993f7881ea0041be4813976973f77e6', \
              rung.rung_ref
          assert rung.track_ref == 'track1:5be892494f3e6894a7de24a868084e0f', \
              rung.track_ref
          assert rung.activity_family_refs == ('expressive_vocabulary_growth',)
          assert rung.is_activity_mappable
          print('17 mappable SLP rungs from the bundled workbook')
          print('rung_ref ', rung.rung_ref)
          print('track_ref', rung.track_ref)
          "

      - name: The generation artifact is not runnable as the web service
        # Four independent reasons, because any one alone could be undone.
        #
        # This step previously asserted the image declared NO default command.
        # That was wrong and this gate caught it: python:3.11.9-slim-bookworm
        # declares `CMD ["python3"]` and a Dockerfile inherits its base image's
        # CMD, so the artifact defaulted to a Python REPL — which with no TTY
        # exits 0, i.e. it appeared to start successfully. The Dockerfile now
        # sets an EXPLICIT refusing CMD instead, and this step verifies the
        # refusal rather than an absence.
        run: |
          python3 - <<'PY'
          import json, subprocess

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True)

          config = json.loads(sh(
              "docker", "image", "inspect", "pilot-generation:ci").stdout
          )[0]["Config"]

          # 1. No entrypoint and no exposed port: nothing to connect to.
          assert not config.get("Entrypoint"), \
              f"image declares Entrypoint: {config.get('Entrypoint')}"
          assert not config.get("ExposedPorts"), \
              f"image exposes ports: {config.get('ExposedPorts')}"

          # 2. The default command is a refusal, and names no server. The
          #    inherited `python3` REPL must not be what is left in place.
          cmd = config.get("Cmd") or []
          joined = " ".join(cmd)
          assert cmd != ["python3"], \
              "image still inherits the base image's bare python3 REPL as CMD"
          assert "BATCH JOB" in joined, f"CMD is not the refusal: {cmd}"
          for server in ("gunicorn", "uvicorn", "waitress",
                         "pilot_runtime.server", "--bind", "0.0.0.0"):
              assert server not in joined, f"CMD names a server: {server}"
          print("no Entrypoint, no exposed port, CMD is an explicit refusal")

          # 3. Running it with no command fails loudly rather than idling.
          started = sh("docker", "run", "--rm", "pilot-generation:ci")
          assert started.returncode != 0, \
              "the image started with no command — it could be deployed as a service"
          assert "BATCH JOB" in (started.stderr + started.stdout), \
              "the refusal did not explain what the image is for"
          print("docker run with no command exits", started.returncode)

          # 4. And the serving entrypoint could not be launched out of it
          #    anyway, because no WSGI container is installed.
          served = sh("docker", "run", "--rm", "pilot-generation:ci",
                      "python", "-c", "import gunicorn")
          assert served.returncode != 0, "gunicorn importable in the job image"
          print("gunicorn not importable: cannot serve pilot_runtime.server")
          PY

      - name: The SERVING image surface is byte-unchanged
        # The founder's requirement A, asserted on the artifact definitions
        # rather than on prose. These four digests are the served API image's
        # entire build surface, measured at the 0.5E-A freeze and unchanged by
        # this slice. A dependency added to the PHI-reviewed web service — the
        # exact thing the separate generation image exists to prevent — fails
        # here.
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, pathlib

          EXPECTED = {
              "Dockerfile":
                  "b2ef486117944c16812566a636f46be4417ccb079abe849afec7adfbf77ae767",
              "requirements.txt":
                  "16f3757abc96a213b20c73cd146ade76b1f2559166a33e62dc3d6474c12070bb",
              "gcloudignore":
                  "a3a87be9f6872c0608aafacdf82d8ef6bb911a83ba678e2db12b79eacdd9a43b",
              "cloudbuild.yaml":
                  "629fc1ce0608f900cd68f49cb7aa504d85ba64f218904106a65d9743cdb31641",
          }
          base = pathlib.Path("pilot_runtime/deploy")
          for name, expected in sorted(EXPECTED.items()):
              got = hashlib.sha256((base / name).read_bytes()).hexdigest()
              assert got == expected, f"serving {name} changed: {got}"
              print(f"serving {name}: {got[:16]}... unchanged")

          # And the two images must not have converged on a tag.
          serving = (base / "cloudbuild.yaml").read_text()
          generation = (base / "cloudbuild-generation.yaml").read_text()
          assert "pilot/pilot-api" in serving
          assert "pilot/pilot-generation" in generation
          assert "pilot/pilot-api" not in generation
          print("serving publishes pilot-api; generation publishes pilot-generation")
          PY

  pilot-projection-image:
    name: October pilot 0.5F-A2 projection artifact
    runs-on: ubuntu-latest

    # The THIRD container-building job pattern in this workflow, after
    # pilot-generation-image. Same reason it exists: the machine that authored
    # 0.5F-A2 had no container runtime, so Dockerfile.projection and its
    # in-build assertions had never executed anywhere.
    #
    # It does NOT publish. No registry login, no push, no credential: the image
    # is built, inspected, run locally and discarded. And it applies no IAM —
    # a step below asserts no build script embeds an IAM policy or allUsers.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the narrowed projection build context
        # Staged from the allowlist in `gcloudignore-projection` rather than
        # from a list restated here, so a path the allowlist forgets is absent
        # from the stage and the build fails.
        #
        # This context is the NARROWEST of the three: unlike the generation
        # image it admits nothing from genex-parent, because the projection
        # service reads no workbook and no taxonomy.
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib, shutil

          ignore = pathlib.Path(
              "pilot_runtime/deploy/gcloudignore-projection").read_text()
          admitted = []
          for line in ignore.splitlines():
              line = line.strip()
              if line.startswith("!") and not line.endswith("**"):
                  path = line[1:].rstrip("/")
                  if path:
                      admitted.append(path)
          assert admitted, "parsed no allowlist entries"
          # Container entries (a parent un-ignored only to admit children)
          # must not be copied wholesale — see the generation job for the case
          # where that would have dragged in the Parent service.
          admitted = [p for p in admitted
                      if not any(q != p and q.startswith(p + "/")
                                 for q in admitted)]
          print("allowlist admits:", admitted)
          assert admitted == ["pilot_backend", "pilot_runtime"], admitted

          stage = pathlib.Path("/tmp/projctx")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          def drop(_root, names):
              return [n for n in names
                      if n in ("__pycache__", "tests", "fixtures")]

          for rel in admitted:
              src = pathlib.Path(rel)
              if src.is_dir():
                  shutil.copytree(src, stage / rel, ignore=drop)

          for required in (
              "pilot_runtime/deploy/Dockerfile.projection",
              "pilot_runtime/deploy/requirements-projection.txt",
              "pilot_runtime/projection_server.py",
              "pilot_runtime/google_oidc.py",
              "pilot_backend/transport/projection_wsgi.py",
              "pilot_backend/integration/baseline_projection_service.py",
              "pilot_backend/domain/parent_baseline_projection.py",
          ):
              assert (stage / required).is_file(), f"missing: {required}"

          # NOTHING from genex-parent, and no top level beyond the two pilot
          # packages. The projection service receives seven validated fields;
          # it has no reason to see Parent content at all.
          assert not (stage / "genex-parent").exists()
          top = sorted(p.name for p in stage.iterdir())
          assert top == ["pilot_backend", "pilot_runtime"], top
          print("staged context top level:", top)

          # The browser app's own entrypoint and CORS layer are present only
          # because they live inside pilot_runtime/, which the service needs.
          # What matters is that the projection entrypoint does not REACH
          # them — proved by the import-graph test in the suite, and by the
          # in-image check that pilot_runtime.server cannot even be imported.
          browser_only = [
              "pilot_runtime/server.py",
              "pilot_runtime/http/cors.py",
          ]
          present = [p for p in browser_only if (stage / p).is_file()]
          print("browser-app files present in context (unreachable, not run):",
                present)
          PY

      - name: Build the projection image from the narrowed context
        # The Dockerfile runs its own assertions during the build: firebase-admin,
        # pandas and openai absent; google-auth and firestore present; no
        # genex-parent bundled; and the application failing closed with no
        # auth mode configured.
        working-directory: .
        run: |
          docker build \
            --file /tmp/projctx/pilot_runtime/deploy/Dockerfile.projection \
            --tag pilot-projection:ci \
            /tmp/projctx

      - name: The built image has the right deps and NOT firebase-admin
        # Re-asserted from OUTSIDE the build against the finished artifact.
        # firebase-admin's absence is the load-bearing one: this service has no
        # end-user authentication, so the capability is absent rather than
        # merely unused — and its absence is what makes the browser app
        # unstartable here.
        run: |
          docker run --rm pilot-projection:ci python -c "
          import importlib.util as u
          assert u.find_spec('firebase_admin') is None, 'firebase-admin present'
          assert u.find_spec('pandas') is None, 'pandas present'
          assert u.find_spec('openai') is None, 'openai present'
          import google.oauth2.id_token, google.cloud.firestore, requests
          print('projection image deps OK: google-auth + firestore, no firebase')
          "

      - name: The projection image cannot start the browser pilot-api server
        run: |
          python3 - <<'PY'
          import subprocess

          def run(*args):
              return subprocess.run(
                  ("docker", "run", "--rm", "pilot-projection:ci") + args,
                  capture_output=True, text=True)

          # `pilot_runtime.server` imports the composition root, which imports
          # the Firebase decoder at module level. With firebase-admin absent
          # the browser entrypoint cannot even be IMPORTED here, let alone
          # served — so this image cannot become the browser API by
          # misconfiguring a CMD.
          out = run("python", "-c", "import pilot_runtime.server")
          assert out.returncode != 0, "the browser entrypoint imported"
          assert "firebase_admin" in (out.stderr + out.stdout), out.stderr
          print("pilot_runtime.server is unimportable here:",
                out.stderr.strip().splitlines()[-1][:90])

          served = run("gunicorn", "--check-config",
                       "pilot_runtime.server:application")
          assert served.returncode != 0, "gunicorn loaded the browser app"
          print("gunicorn cannot load the browser app either")
          PY

      - name: The projection entrypoint starts in iam_only and fails closed
        # Non-secret configuration only: a project id, a database name and the
        # declared auth mode. No audience and no caller are needed in
        # `iam_only`, because the app verifies no token in that posture —
        # Cloud Run IAM is the authoritative gate.
        run: |
          docker run --rm \
            -e PILOT_ENVIRONMENT=dev \
            -e PILOT_GCP_PROJECT_ID=genex-pilot-staging \
            -e PILOT_FIREBASE_PROJECT_ID=genex-pilot-staging \
            -e PILOT_FIRESTORE_DATABASE=pilot-staging \
            pilot-projection:ci python -c "
          from pilot_runtime.projection_server import (
              build_projection_application as build, ProjectionConfigError)

          class FakeFirestore:
              def collection(self, *a, **k):
                  return self

          import os
          env = dict(os.environ)

          # 1. no auth mode declared -> refuses to start
          try:
              build(env, firestore_client=FakeFirestore())
              raise SystemExit('started with no auth mode declared')
          except ProjectionConfigError:
              print('no auth mode            -> refused')

          # 2. unknown auth mode -> refuses
          for bad in ('iam', 'off', 'IAM_ONLY', 'iam_only_please'):
              try:
                  build(dict(env, PILOT_PROJECTION_AUTH_MODE=bad),
                        firestore_client=FakeFirestore())
                  raise SystemExit('started with auth mode ' + bad)
              except ProjectionConfigError:
                  pass
          print('unknown auth modes      -> refused')

          # 3. iam_plus_token without its verifier configuration -> refuses
          for partial in ({}, {'PILOT_PROJECTION_AUDIENCE': 'https://x'},
                          {'PILOT_PROJECTION_CALLER': 'a@b.iam.gserviceaccount.com'}):
              try:
                  build(dict(env, PILOT_PROJECTION_AUTH_MODE='iam_plus_token',
                             **partial), firestore_client=FakeFirestore())
                  raise SystemExit('iam_plus_token started underconfigured')
              except ProjectionConfigError:
                  pass
          print('iam_plus_token partial  -> refused')

          # 4. iam_only with only non-secret config -> STARTS, verifying nothing
          app = build(dict(env, PILOT_PROJECTION_AUTH_MODE='iam_only'),
                      firestore_client=FakeFirestore())
          assert callable(app)
          assert app.verifies_tokens is False
          print('iam_only                -> started, verifies_tokens=False')

          # 5. iam_plus_token fully configured -> starts WITH the verifier
          app2 = build(dict(env, PILOT_PROJECTION_AUTH_MODE='iam_plus_token',
                            PILOT_PROJECTION_AUDIENCE='https://example.invalid',
                            PILOT_PROJECTION_CALLER='genex-parent-staging-run@genex-mvp-2026.iam.gserviceaccount.com'),
                       firestore_client=FakeFirestore())
          assert app2.verifies_tokens is True
          print('iam_plus_token full     -> started, verifies_tokens=True')
          "

      - name: The serving and generation build surfaces are byte-unchanged
        # 0.5F-A2 adds a THIRD image. Neither of the first two may move: the
        # browser-facing API is the PHI-review surface, and the generation
        # image was frozen at 0.5E-B.
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, pathlib

          EXPECTED = {
              # browser-facing serving image (frozen at 0.5E-B)
              "Dockerfile":
                  "b2ef486117944c16812566a636f46be4417ccb079abe849afec7adfbf77ae767",
              "requirements.txt":
                  "16f3757abc96a213b20c73cd146ade76b1f2559166a33e62dc3d6474c12070bb",
              "gcloudignore":
                  "a3a87be9f6872c0608aafacdf82d8ef6bb911a83ba678e2db12b79eacdd9a43b",
              "cloudbuild.yaml":
                  "629fc1ce0608f900cd68f49cb7aa504d85ba64f218904106a65d9743cdb31641",
              # offline generation image (frozen at 0.5E-B)
              "Dockerfile.generation":
                  "e9c81f2a3080ffec4f2ad27bf08b27222f5b26a8f029d3ff04cae94f3a2d97a1",
              "requirements-generation.txt":
                  "e6d8fcda91e7c02aa890acc7f21f9c1116fe4423a960ecbca40126f77406da69",
              "gcloudignore-generation":
                  "7a14bae0e711f1525a36f6661507cab5f42290d7112694631c7f27c60645c422",
              "cloudbuild-generation.yaml":
                  "29d9e2298ce4c07ce5fabf26848980b72355168b224e52b08042faf43faf3c89",
          }
          base = pathlib.Path("pilot_runtime/deploy")
          for name, expected in sorted(EXPECTED.items()):
              got = hashlib.sha256((base / name).read_bytes()).hexdigest()
              assert got == expected, f"{name} changed: {got}"
              print(f"unchanged  {name}")

          # Three images, three tags, no overlap.
          tags = {}
          for cfg in ("cloudbuild.yaml", "cloudbuild-generation.yaml",
                      "cloudbuild-projection.yaml"):
              text = (base / cfg).read_text()
              for tag in ("pilot/pilot-api", "pilot/pilot-generation",
                          "pilot/pilot-projection"):
                  if tag in text:
                      tags.setdefault(tag, []).append(cfg)
          assert tags == {
              "pilot/pilot-api": ["cloudbuild.yaml"],
              "pilot/pilot-generation": ["cloudbuild-generation.yaml"],
              "pilot/pilot-projection": ["cloudbuild-projection.yaml"],
          }, tags
          print("three build configs, three distinct images")
          PY

      - name: No build script embeds or applies IAM
        # 0.5F-A2 applies NO IAM. The build artifacts must not quietly contain
        # a policy, an allUsers grant, or a key file — and must not shell out
        # to gcloud to apply one.
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib

          # A GRANT is an instruction, not prose. These files deliberately
          # EXPLAIN in comments why there is no allUsers and which single
          # invoker binding is expected, so a whole-file substring scan would
          # flag their own documentation — which is exactly what the first
          # version of this gate did when dry-run locally.
          #
          # So policy tokens are scanned over EFFECTIVE lines only: comments
          # stripped. Key material is scanned over the whole file, because
          # there is no legitimate reason to mention a private key or a
          # credentials filename even in a comment.
          POLICY_TOKENS = (
              "allUsers", "allAuthenticatedUsers",
              "add-iam-policy-binding", "set-iam-policy",
              "roles/run.invoker", "roles/storage.admin",
              "roles/storage.objectAdmin", "roles/editor", "roles/owner",
              "--allow-unauthenticated",
          )
          KEY_TOKENS = (
              "service_account_key", "credentials.json", "key.json",
              "BEGIN PRIVATE KEY",
          )

          def effective(text: str) -> str:
              out = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("#") or not stripped:
                      continue
                  out.append(line.split(" #", 1)[0])
              return "\n".join(out)

          deploy = pathlib.Path("pilot_runtime/deploy")
          checked = 0
          for path in sorted(deploy.iterdir()):
              if path.is_dir() or path.name.endswith(".sh"):
                  # The auth PROBE legitimately reads IAM policy and names the
                  # invoker role: it is an operator diagnostic, is in no build
                  # context, and is excluded from CI by name. It is checked
                  # separately below for MUTATING commands.
                  continue
              raw = path.read_text(errors="replace")
              checked += 1
              for needle in KEY_TOKENS:
                  assert needle not in raw, f"{path.name} names {needle!r}"
              code = effective(raw)
              for needle in POLICY_TOKENS:
                  assert needle not in code, \
                      f"{path.name} APPLIES or embeds {needle!r}"
          assert checked >= 12, checked
          print(f"{checked} build/deploy files embed no IAM grant and no key")

          # And the probe, which DOES name IAM, must never apply any.
          probe = (deploy / "probe_projection_auth.sh").read_text()
          for mutating in ("add-iam-policy-binding", "set-iam-policy",
                           "remove-iam-policy-binding", "gcloud run deploy",
                           "gcloud run services update"):
              assert mutating not in probe, mutating
          print("the auth probe reads IAM and mutates nothing")
          PY

  pilot-bootstrap-image:
    name: October pilot 0.5F-A3 bootstrap artifact
    runs-on: ubuntu-latest

    # The FOURTH container-building job, after pilot-generation-image and
    # pilot-projection-image. Same reason all three exist: the machine that
    # authored this slice has no container runtime, so Dockerfile.bootstrap and
    # its in-build assertions had never executed anywhere.
    #
    # It does NOT publish. No registry login, no push, no credential: the image
    # is built, inspected, run locally and discarded. And it applies no IAM — a
    # step below asserts no build script embeds a policy or an allUsers grant.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the narrowed bootstrap build context
        # Staged from the allowlist in `gcloudignore-bootstrap` rather than from
        # a list restated here, so a path the allowlist forgets is absent from
        # the stage and the build fails.
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib, shutil

          ignore = pathlib.Path(
              "pilot_runtime/deploy/gcloudignore-bootstrap").read_text()
          admitted = []
          for line in ignore.splitlines():
              line = line.strip()
              if line.startswith("!") and not line.endswith("**"):
                  path = line[1:].rstrip("/")
                  if path:
                      admitted.append(path)
          assert admitted, "parsed no allowlist entries"
          admitted = [p for p in admitted
                      if not any(q != p and q.startswith(p + "/")
                                 for q in admitted)]
          print("allowlist admits:", admitted)
          assert admitted == ["pilot_backend", "pilot_runtime"], admitted

          stage = pathlib.Path("/tmp/bootctx")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          def drop(_root, names):
              return [n for n in names
                      if n in ("__pycache__", "tests", "fixtures")]

          for rel in admitted:
              src = pathlib.Path(rel)
              if src.is_dir():
                  shutil.copytree(src, stage / rel, ignore=drop)

          for required in (
              "pilot_runtime/deploy/Dockerfile.bootstrap",
              "pilot_runtime/deploy/requirements-bootstrap.txt",
              "pilot_runtime/bootstrap_server.py",
              "pilot_runtime/bootstrap_iam.py",
              "pilot_runtime/google_oidc.py",
              "pilot_backend/transport/bootstrap_wsgi.py",
              "pilot_backend/integration/parent_session_claim_service.py",
              "pilot_backend/domain/parent_session_claim.py",
          ):
              assert (stage / required).is_file(), f"missing: {required}"

          # NOTHING from genex-parent, and no top level beyond the two pilot
          # packages. The bootstrap service receives a digest, a session id and
          # an integer; it has no reason to see Parent content at all.
          assert not (stage / "genex-parent").exists()
          top = sorted(p.name for p in stage.iterdir())
          assert top == ["pilot_backend", "pilot_runtime"], top
          print("staged context top level:", top)
          PY

      - name: Build the bootstrap image from the narrowed context
        # The Dockerfile runs its own assertions during the build: firebase-admin,
        # pandas and openai absent; google-auth and firestore present; no
        # genex-parent bundled; the application failing closed with no auth mode;
        # and the registration validator refusing a raw token.
        working-directory: .
        run: |
          docker build \
            --file /tmp/bootctx/pilot_runtime/deploy/Dockerfile.bootstrap \
            --tag pilot-bootstrap:ci \
            /tmp/bootctx

      - name: The built image has the right deps and NOT firebase-admin
        # Re-asserted from OUTSIDE the build against the finished artifact.
        # firebase-admin's absence is load-bearing: this service has no end-user
        # authentication, so the capability is absent rather than merely unused
        # — and its absence is what makes the browser app unstartable here.
        run: |
          docker run --rm pilot-bootstrap:ci python -c "
          import importlib.util as u
          assert u.find_spec('firebase_admin') is None, 'firebase-admin present'
          assert u.find_spec('pandas') is None, 'pandas present'
          assert u.find_spec('openpyxl') is None, 'openpyxl present'
          assert u.find_spec('openai') is None, 'openai present'
          assert u.find_spec('anthropic') is None, 'anthropic present'
          import google.oauth2.id_token, google.cloud.firestore, requests
          print('bootstrap image deps OK: google-auth + firestore, no firebase')
          "

      - name: The bootstrap image runs no other service entrypoint
        # Four images now exist. This one must be unable to serve any of the
        # other three, so a misconfigured CMD cannot turn it into the browser
        # API, the projection service or the generation job.
        run: |
          python3 - <<'PY'
          import subprocess

          def run(*args):
              return subprocess.run(
                  ("docker", "run", "--rm", "pilot-bootstrap:ci") + args,
                  capture_output=True, text=True)

          # The BROWSER app: `pilot_runtime.server` imports the composition
          # root, which imports the Firebase decoder at module level. With
          # firebase-admin absent it cannot even be imported here.
          out = run("python", "-c", "import pilot_runtime.server")
          assert out.returncode != 0, "the browser entrypoint imported"
          assert "firebase_admin" in (out.stderr + out.stdout), out.stderr
          print("pilot_runtime.server          -> unimportable")

          served = run("gunicorn", "--check-config",
                       "pilot_runtime.server:application")
          assert served.returncode != 0, "gunicorn loaded the browser app"
          print("gunicorn browser app          -> cannot load")

          # The CORS layer the browser app wraps itself in must not be
          # reachable as a served application either.
          cors = run("python", "-c",
                     "from pilot_runtime.http.cors import CorsMiddleware; "
                     "import pilot_runtime.server")
          assert cors.returncode != 0, "the CORS browser stack assembled"
          print("browser CORS stack            -> cannot assemble")

          # The PROJECTION service: a separate, frozen A2 artifact. Its module
          # is present in the context (it lives under pilot_runtime/), but this
          # image must not be deployable as it — the CMD names the bootstrap
          # entrypoint, asserted below, and the two services have separate
          # runtime identities and invoker bindings.
          proj = run("python", "-c",
                     "import pilot_runtime.projection_server as p; "
                     "p.build_projection_application({})")
          assert proj.returncode != 0, "the projection app started here"
          print("projection app                -> refuses to start")

          # The GENERATION path cannot RUN here, which is the true property —
          # and not the one a naive import check would test.
          #
          # `generate_suggestions_job` and the Parent gold-standard adapter
          # import FINE in this image: both import pandas lazily, inside the
          # methods that read a workbook. So "the generation job is
          # unimportable" is simply false, and asserting it failed this step on
          # the first hosted run. What is true is that the DATA and the reader
          # are both absent, so no generation can occur.
          deps = run("python", "-c",
                     "import importlib.util as u; "
                     "assert u.find_spec('pandas') is None; "
                     "assert u.find_spec('openpyxl') is None; "
                     "print('no workbook reader installed')")
          assert deps.returncode == 0, deps.stderr
          print("workbook reader               -> absent (pandas, openpyxl)")

          data = run("python", "-c",
                     "import pathlib, sys; "
                     "root = pathlib.Path('/app'); "
                     "assert not (root / 'genex-parent').exists(); "
                     "books = sorted(str(p) for p in root.rglob('*.xlsx')); "
                     "assert books == [], books; "
                     "print('no workbook and no Parent tree in the image')")
          assert data.returncode == 0, data.stderr
          print("workbook data                 -> absent, no genex-parent tree")

          # And the image's own CMD names the bootstrap entrypoint only.
          cmd = subprocess.run(
              ("docker", "inspect", "-f", "{{json .Config.Cmd}}",
               "pilot-bootstrap:ci"), capture_output=True, text=True, check=True)
          assert "bootstrap_server:application" in cmd.stdout, cmd.stdout
          assert "projection_server" not in cmd.stdout
          assert "pilot_runtime.server:" not in cmd.stdout
          print("image CMD                     ->", cmd.stdout.strip()[:88])
          PY

      - name: The bootstrap entrypoint starts in iam_only and fails closed
        # Non-secret configuration only: a project id, a database name and the
        # declared auth mode. No audience and no caller are needed in
        # `iam_only`, because the app verifies no token in that posture —
        # Cloud Run IAM is the authoritative gate.
        run: |
          docker run --rm \
            -e PILOT_ENVIRONMENT=dev \
            -e PILOT_GCP_PROJECT_ID=genex-pilot-staging \
            -e PILOT_FIREBASE_PROJECT_ID=genex-pilot-staging \
            -e PILOT_FIRESTORE_DATABASE=pilot-staging \
            pilot-bootstrap:ci python -c "
          from pilot_runtime.bootstrap_server import (
              build_bootstrap_application as build, BootstrapConfigError)

          class FakeFirestore:
              def collection(self, *a, **k):
                  return self

          import os
          env = dict(os.environ)

          # 1. no auth mode declared -> refuses to start
          try:
              build(env, firestore_client=FakeFirestore())
              raise SystemExit('started with no auth mode declared')
          except BootstrapConfigError:
              print('no auth mode            -> refused')

          # 2. unknown auth mode -> refuses
          for bad in ('iam', 'off', 'IAM_ONLY', 'iam_only_please', ''):
              try:
                  build(dict(env, PILOT_BOOTSTRAP_AUTH_MODE=bad),
                        firestore_client=FakeFirestore())
                  raise SystemExit('started with auth mode ' + repr(bad))
              except BootstrapConfigError:
                  pass
          print('unknown auth modes      -> refused')

          # 3. iam_plus_token without its verifier configuration -> refuses
          for partial in ({}, {'PILOT_BOOTSTRAP_AUDIENCE': 'https://x'},
                          {'PILOT_BOOTSTRAP_CALLER': 'a@b.iam.gserviceaccount.com'}):
              try:
                  build(dict(env, PILOT_BOOTSTRAP_AUTH_MODE='iam_plus_token',
                             **partial), firestore_client=FakeFirestore())
                  raise SystemExit('iam_plus_token started underconfigured')
              except BootstrapConfigError:
                  pass
          print('iam_plus_token partial  -> refused')

          # 4. iam_only with only non-secret config -> STARTS, verifying nothing
          app = build(dict(env, PILOT_BOOTSTRAP_AUTH_MODE='iam_only'),
                      firestore_client=FakeFirestore())
          assert callable(app)
          assert app.verifies_tokens is False
          print('iam_only                -> started, verifies_tokens=False')

          # 5. production is refused outright, even FULLY and VALIDLY configured.
          #
          # The ids are overridden to prod-shaped names on purpose. Reusing the
          # container's staging ids makes PilotSettings refuse first — 'prod
          # PILOT_GCP_PROJECT_ID names a non-production resource (contains
          # staging)' — and that ConfigError arrives BEFORE the bootstrap
          # service's own prod guard ever runs. Catching it would make this
          # check pass without testing the thing it names.
          prod = dict(env, PILOT_ENVIRONMENT='prod',
                      PILOT_GCP_PROJECT_ID='genex-pilot-prod',
                      PILOT_FIREBASE_PROJECT_ID='genex-pilot-prod',
                      PILOT_FIRESTORE_DATABASE='pilot-prod',
                      PILOT_ALLOWED_ORIGINS='https://example.invalid',
                      PILOT_BOOTSTRAP_AUTH_MODE='iam_only')
          try:
              build(prod, firestore_client=FakeFirestore())
              raise SystemExit('the bootstrap service started in prod')
          except BootstrapConfigError:
              print('prod environment        -> refused by the service itself')
          "

      - name: The raw claim token is never persisted and never loggable
        # The central guarantee of the capability design: the Pilot stores a
        # DIGEST, so a compromise of its storage or its logs yields nothing
        # redeemable. Asserted inside the finished image, against the real
        # codec and the real log validator.
        run: |
          docker run --rm pilot-bootstrap:ci python -c "
          import json
          from datetime import datetime, timezone

          from pilot_backend.domain.parent_session_claim import (
              ParentSessionClaim, claim_digest, generate_claim_token)
          from pilot_backend.persistence.codecs import encode
          from pilot_backend.observability.safe_logging import (
              ALLOWED_LOG_FIELDS, FORBIDDEN_LOG_FIELDS, format_log)
          from pilot_backend.integration.parent_session_claim_service import (
              FORBIDDEN_REGISTRATION_FIELDS, validate_registration_payload)

          token = generate_claim_token()
          assert len(token) >= 43, 'token too short for 256 bits'
          digest = claim_digest(token)

          # 1. the ENCODED document carries no preimage
          claim = ParentSessionClaim.issue(
              digest, 'fictional-session', now=datetime.now(timezone.utc))
          document = encode(claim)
          rendered = json.dumps(document, default=str)
          assert token not in rendered, 'the raw token reached the document'
          assert digest in rendered
          assert set(document) == {
              'claim_digest', 'source_system', 'source_session_id',
              'issued_at', 'expires_at', 'schema_version'}, sorted(document)
          print('stored document         -> digest only, 6 fields')

          # 2. no uid of either system is storable on a claim
          for forbidden in ('owner_uid', 'parent_uid', 'pilot_uid',
                            'auth_subject', 'caregiver_id', 'child_id',
                            'external_owner_ref', 'email'):
              assert forbidden not in document, forbidden
          print('stored document         -> no uid of either system')

          # 3. the registration validator refuses a raw token outright
          assert 'claim_token' in FORBIDDEN_REGISTRATION_FIELDS
          try:
              validate_registration_payload({
                  'claim_digest': digest,
                  'source_session_id': 'fictional-session',
                  'claim_token': token})
              raise SystemExit('a raw token was accepted for registration')
          except Exception as exc:
              assert 'claim_token' not in str(exc), 'the error quoted the token'
              print('registration validator  -> refuses a raw token')

          # 4. the token is UNLOGGABLE under every plausible field name
          for name in ('claim_token', 'claim_digest', 'raw_token',
                       'capability', 'capability_token', 'handoff_token',
                       'token'):
              assert name in FORBIDDEN_LOG_FIELDS, name
              assert name not in ALLOWED_LOG_FIELDS, name
              try:
                  format_log(request_id='r', event='http_request',
                             route='/pilot/parent-session-claims',
                             method='POST', status=200, environment='dev',
                             **{name: token})
                  raise SystemExit('a log line accepted ' + name)
              except SystemExit:
                  raise
              except Exception:
                  pass
          print('log validator           -> refuses every token field name')
          "

      - name: The bootstrap IAM proposal is minimal and applies nothing
        # CLARIFICATION 1. Two boundaries, stated separately because they are
        # different: Firestore server-side IAM is `datastore.entities.*` at the
        # DATABASE level and is NOT a per-collection authorization boundary.
        # The single-collection restriction is an APPLICATION property.
        working-directory: .
        run: |
          python3 - <<'PY'
          from pilot_runtime import bootstrap_iam as iam

          # --- the IAM boundary: as narrow as GCP permits -----------------
          assert set(iam.REQUIRED_PERMISSIONS) == {
              "datastore.entities.create", "datastore.entities.get"}, \
              sorted(iam.REQUIRED_PERMISSIONS)
          for excluded in ("datastore.entities.update",
                           "datastore.entities.delete",
                           "datastore.entities.list"):
              assert excluded not in iam.REQUIRED_PERMISSIONS, excluded
              assert excluded in iam.EXCLUDED_PERMISSIONS, excluded
          print("IAM permissions         ->", sorted(iam.REQUIRED_PERMISSIONS))

          for role in ("roles/datastore.user", "roles/datastore.owner",
                       "roles/editor", "roles/owner"):
              assert role in iam.REJECTED_ROLES, role
          commands = " ".join(iam.gcloud_commands())
          for broad in ("roles/datastore.user", "roles/datastore.owner",
                        "roles/editor", "roles/owner",
                        "roles/datastore.importExportAdmin"):
              assert broad not in commands, broad
          print("broad roles             -> none proposed")

          # a DEDICATED identity, not the A2 projection one
          assert iam.BOOTSTRAP_SERVICE_ACCOUNT.startswith(
              "pilot-bootstrap-staging-run@")
          assert "pilot-projection-staging-run@" not in commands
          assert "pilot-staging-run@" not in commands
          print("runtime identity        ->", iam.BOOTSTRAP_SERVICE_ACCOUNT)

          # exactly one invoker, and no public access
          assert iam.PERMITTED_INVOKER == (
              "genex-parent-staging-run@genex-mvp-2026.iam.gserviceaccount.com")
          assert "allUsers" not in commands
          assert "allAuthenticatedUsers" not in commands
          assert "--allow-unauthenticated" not in commands
          print("invoker                 -> one SA, no allUsers")

          # the correction itself is recorded, so the wrong mental model
          # cannot be re-acquired from this module
          doc = iam.__doc__ or ""
          assert "NOT PER-COLLECTION" in doc.upper()
          assert "only on the claims collection" not in doc
          print("IAM scope               -> documented as database-level")

          # --- the APPLICATION boundary: where collection scoping lives ---
          assert iam.PERMITTED_REPOSITORIES == ("parent_session_claims",)
          for forbidden in ("children", "caregiver_child", "source_links",
                            "identity_claims", "goal_suggestions",
                            "clinical_goals", "focus_plans", "weekly_cycles",
                            "observation_events", "rtm_episodes",
                            "rtm_periods", "parent_baseline_projections"):
              assert forbidden in iam.FORBIDDEN_REPOSITORIES, forbidden
          print("repositories reached    ->", iam.PERMITTED_REPOSITORIES)
          PY

      - name: The three earlier build surfaces are byte-unchanged
        # 0.5F-A3 adds a FOURTH image. None of the first three may move: the
        # browser-facing API is the PHI-review surface, the generation image was
        # frozen at 0.5E-B, and the projection image was frozen at 0.5F-A2.
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess

          A2_TAG = "october-pilot-0.5f-a2-parent-baseline-projection"
          FROZEN = (
              # browser-facing serving image (frozen at 0.5E-B)
              "pilot_runtime/deploy/Dockerfile",
              "pilot_runtime/deploy/requirements.txt",
              "pilot_runtime/deploy/gcloudignore",
              "pilot_runtime/deploy/cloudbuild.yaml",
              # offline generation image (frozen at 0.5E-B)
              "pilot_runtime/deploy/Dockerfile.generation",
              "pilot_runtime/deploy/requirements-generation.txt",
              "pilot_runtime/deploy/gcloudignore-generation",
              "pilot_runtime/deploy/cloudbuild-generation.yaml",
              # internal projection service (frozen at 0.5F-A2)
              "pilot_runtime/deploy/Dockerfile.projection",
              "pilot_runtime/deploy/requirements-projection.txt",
              "pilot_runtime/deploy/gcloudignore-projection",
              "pilot_runtime/deploy/cloudbuild-projection.yaml",
              "pilot_runtime/deploy/probe_projection_auth.sh",
              "pilot_runtime/projection_server.py",
              "pilot_runtime/google_oidc.py",
              "pilot_backend/transport/projection_wsgi.py",
              "pilot_backend/integration/baseline_projection_service.py",
              "pilot_backend/domain/parent_baseline_projection.py",
              "genex-parent/api/parent_baseline_projection_client.py",
              "genex-parent/api/session_store.py",
              "genex-parent/api/session_store_iam.py",
              "genex-parent/api/functional_baseline_api.py",
          )
          # Compared against the TAG rather than a hash list restated here: a
          # literal would have to be updated by the same edit that broke it.
          for rel in FROZEN:
              want = subprocess.run(["git", "rev-parse", f"{A2_TAG}:{rel}"],
                                    capture_output=True, text=True, check=True)
              got = subprocess.run(["git", "hash-object", rel],
                                   capture_output=True, text=True, check=True)
              assert got.stdout.strip() == want.stdout.strip(), \
                  f"{rel} differs from {A2_TAG}"
              print(f"unchanged  {rel}")
          print(f"{len(FROZEN)} earlier artifacts byte-identical to {A2_TAG}")

          # Four images, four tags, no overlap.
          base = pathlib.Path("pilot_runtime/deploy")
          tags = {}
          for cfg in ("cloudbuild.yaml", "cloudbuild-generation.yaml",
                      "cloudbuild-projection.yaml", "cloudbuild-bootstrap.yaml"):
              text = (base / cfg).read_text()
              for tag in ("pilot/pilot-api", "pilot/pilot-generation",
                          "pilot/pilot-projection", "pilot/pilot-bootstrap"):
                  if tag in text:
                      tags.setdefault(tag, []).append(cfg)
          assert tags == {
              "pilot/pilot-api": ["cloudbuild.yaml"],
              "pilot/pilot-generation": ["cloudbuild-generation.yaml"],
              "pilot/pilot-projection": ["cloudbuild-projection.yaml"],
              "pilot/pilot-bootstrap": ["cloudbuild-bootstrap.yaml"],
          }, tags
          print("four build configs, four distinct images")
          PY

      - name: No bootstrap build script embeds or applies IAM
        # 0.5F-A3 applies NO IAM. The build artifacts must not contain a policy,
        # an allUsers grant or key material — and must not shell out to gcloud
        # to apply one.
        working-directory: .
        run: |
          python3 - <<'PY'
          import pathlib

          # A GRANT is an instruction, not prose. Dockerfile.bootstrap
          # deliberately EXPLAINS in comments why there is no allUsers, so a
          # whole-file substring scan would flag its own documentation — the
          # trap the A2 version of this gate hit when dry-run locally.
          #
          # Policy tokens are therefore scanned over EFFECTIVE lines (comments
          # stripped); key material is scanned over the whole file, because
          # there is no legitimate reason to name a private key even in a
          # comment.
          POLICY_TOKENS = (
              "allUsers", "allAuthenticatedUsers",
              "add-iam-policy-binding", "set-iam-policy",
              "roles/run.invoker", "roles/datastore.user", "roles/editor",
              "roles/owner", "--allow-unauthenticated",
          )
          KEY_TOKENS = (
              "service_account_key", "credentials.json", "key.json",
              "BEGIN PRIVATE KEY",
          )
          FILES = (
              "pilot_runtime/deploy/Dockerfile.bootstrap",
              "pilot_runtime/deploy/requirements-bootstrap.txt",
              "pilot_runtime/deploy/cloudbuild-bootstrap.yaml",
              "pilot_runtime/deploy/gcloudignore-bootstrap",
          )
          for rel in FILES:
              text = pathlib.Path(rel).read_text()
              effective = "\n".join(line.split("#", 1)[0]
                                    for line in text.splitlines())
              for token in POLICY_TOKENS:
                  assert token not in effective, f"{rel} applies {token}"
              for token in KEY_TOKENS:
                  assert token not in text, f"{rel} names {token}"
              print(f"no IAM, no key material  {rel}")

          # `bootstrap_iam.py` PROPOSES commands as data and must never run
          # them: no subprocess, no os.system, no gcloud invocation.
          iam_src = pathlib.Path("pilot_runtime/bootstrap_iam.py").read_text()
          for banned in ("subprocess", "os.system", "os.popen", "shutil.which",
                         "check_call", "check_output", "Popen"):
              assert banned not in iam_src, f"bootstrap_iam.py uses {banned}"
          print("bootstrap_iam.py proposes commands as DATA; executes nothing")
          PY
