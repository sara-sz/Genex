name: Parent 2.4 CI

# Hosted gate for the Parent 2.4 taxonomy lineage.
#
# Test-only. No GCP/Firebase auth, no secrets, no deploy, no Terraform, no Cloud
# Run, no therapist-service access, no real data. Reads the frozen Gold Standard
# workbook and writes only to a temporary directory.
#
# Scope note: this workflow deliberately does NOT run
# therapist_api/tests/test_repo_integrity.py. Two of its tests
# (test_worktree_is_on_therapist_branch, test_therapist_commits_touch_only_
# therapist_paths) are scoped to the therapist workstream and fail on a Parent
# branch by construction. They are correct as written and remain unmodified;
# genex-parent/tests/test_parent_24_integrity.py is the Parent-scoped
# equivalent. The therapist workflow is untouched and still gates its own
# branches.

on:
  push:
    branches:
      - "feature/parent-2.4-*"
      # October pilot lineage. Branches from the Parent 2.4 freeze and carries
      # the shared pilot_backend/ namespace, so it must run the SAME Parent
      # gates — a shared identity model that breaks the Brain is still broken.
      - "feature/october-pilot-*"
  pull_request:
    paths:
      - "genex-parent/**"
      - "pilot_backend/**"
      - ".github/workflows/parent-2.4-ci.yml"

permissions:
  contents: read

jobs:
  taxonomy:
    name: Parent 2.4 taxonomy + integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genex-parent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the Parent integrity checks compare object
          # hashes against beta-2.1-freeze and diff against
          # parent-2.4-0.2-taxonomy-foundation. A shallow checkout would make
          # those tests SKIP instead of run. Read-only; no credentials persisted.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI-only dependencies
        # Exact pins — see requirements-parent24-ci.txt for why the application
        # requirements.txt is deliberately NOT used here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parent24-ci.txt
          pip list

      - name: Python compilation (taxonomy package + Brain + Parent 2.4 tests)
        run: |
          python -m compileall -q parent_taxonomy genex_core \
            tests/test_parent_24_taxonomy.py \
            tests/test_parent_24_integrity.py \
            tests/test_parent_24_seven_domain_brain.py \
            tests/test_parent_24_activity_families.py \
            tests/test_parent_24_repair_pass1.py \
            tests/test_parent_24_repair_pass2.py \
            tests/test_parent_24_regression_nonvacuity.py \
            tests/test_parent_24_domain_compat.py \
            tests/test_parent_24_daily_living.py \
            tests/test_parent_24_functional_baseline.py \
            tests/test_regression.py

      - name: Taxonomy package imports with stdlib only
        # The canonical vocabulary must stay usable by consumers that must not
        # drag pandas in. Proven by blocking the third-party modules outright.
        run: |
          python - <<'PY'
          import sys
          BLOCKED = {"pandas", "numpy", "openpyxl"}
          class Blocker:
              def find_module(self, name, path=None):
                  return self if name.split(".")[0] in BLOCKED else None
              def load_module(self, name):
                  raise ImportError(f"BLOCKED: {name}")
          sys.meta_path.insert(0, Blocker())
          sys.path.insert(0, ".")
          import parent_taxonomy
          from parent_taxonomy import activity_families, domains, subdomain_map
          assert len(domains.DOMAINS) == 7, domains.DOMAIN_KEYS
          assert len(subdomain_map.SUBDOMAIN_TO_DOMAIN) == 24
          # activity_families reads a workbook, so it must keep pandas/openpyxl
          # function-local. Importing it here under the blocker proves that.
          assert activity_families.EXPECTED_FAMILY_COUNT == 56
          print("stdlib-only import OK: 7 domains, 24 subdomains, activity_families")
          PY

      - name: Frozen Gold Standard provenance
        run: |
          python - <<'PY'
          import hashlib, pathlib
          EXPECTED = "c2b6735d9f099c916973c98c1953e7eb1f2ca8e1a60430011f805a3bf9c3487c"
          p = pathlib.Path("data/cdc_milestones_with_bridges_family_cleaned_final_app_ready.xlsx")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == EXPECTED, f"Gold Standard changed: {got}"
          print("Gold Standard SHA OK:", got)
          PY

      - name: Parent 2.4 taxonomy tests
        run: python -m pytest tests/test_parent_24_taxonomy.py -q

      - name: Parent 2.4 workstream integrity
        run: python -m pytest tests/test_parent_24_integrity.py -q

      - name: Parent 2.4 seven-domain Brain (Phase 0.3B)
        run: python -m pytest tests/test_parent_24_seven_domain_brain.py -q

      - name: Parent 2.4 activity-family taxonomy + validator (Phase 0.3B)
        run: python -m pytest tests/test_parent_24_activity_families.py -q

      - name: Parent 2.4 runtime repair pass 1 (canonical safety + legacy keys)
        run: python -m pytest tests/test_parent_24_repair_pass1.py -q

      - name: Parent 2.4 runtime repair pass 2 (founder decisions)
        run: python -m pytest tests/test_parent_24_repair_pass2.py -q

      - name: Parent 2.4 regression non-vacuity guard
        # A legacy domain key yields zero questions and zero activities, so a
        # test that feeds one and iterates asserts NOTHING and still reports
        # success. Ten regression tests were green for exactly that reason.
        # This guard fails loudly instead of going quiet.
        run: python -m pytest tests/test_parent_24_regression_nonvacuity.py -q

      - name: Parent 2.4 API consumer + legacy read compatibility (Phase 0.3C)
        # The four-area API focus surface is kept for compatibility, so a legacy
        # key can still reach the Brain — which returns NOTHING for one, without
        # raising. These gate the projection at that boundary, and in particular
        # that an ambiguous legacy movement_and_physical record is never guessed.
        run: python -m pytest tests/test_parent_24_domain_compat.py -q

      - name: Parent 2.4 Daily Living activity generation
        # Daily Living planned correctly but produced ZERO usable activities:
        # its buckets had no curated cards, so every card fell through to the
        # generic template the validator blocks. Repaired with content, not by
        # relaxing validation — this suite pins BOTH halves, so it fails if the
        # skills stop generating cards AND if anyone softens the placeholder
        # rule to make them pass. It also holds cup_drinking and
        # feeding_self_regulation closed pending clinical review.
        run: python -m pytest tests/test_parent_24_daily_living.py -q

      - name: Parent 2.4 deterministic functional baseline
        # A structured entry step before the estimator. Gated because the suite
        # pins properties that fail silently if broken: the baseline must stay
        # LLM-free and deterministic, "Not sure" and a missing answer must never
        # become the legacy six-month dev_age, and calibration must stay on one
        # coherent skill track so an uneven-but-normal profile is never read as
        # a contradiction. It also holds Daily Living "Not sure" to UNRESOLVED.
        run: python -m pytest tests/test_parent_24_functional_baseline.py -q

      - name: October pilot backend — identity foundation
        # Runs from the repository root, not genex-parent/, because
        # pilot_backend/ is a top-level shared namespace (Parent + Therapist +
        # later RTM). Needs only pytest and the standard library — no new
        # dependency, and deliberately no database driver or auth SDK.
        #
        # Skipped automatically on branches that predate the pilot so the
        # existing Parent 2.4 branches keep passing unchanged.
        working-directory: .
        run: |
          if [ -d pilot_backend ]; then
            python -m pytest pilot_backend/tests -q
          else
            echo "pilot_backend/ not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4A — longitudinal identity (unit)
        # Runs in the DEPENDENCY-PURE job on purpose: the identity domain,
        # claims and service import no SDK, and proving that here is what
        # keeps the pilot_backend/pilot_runtime split honest.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_longitudinal_identity.py ]; then
            python -m pytest pilot_backend/tests/test_longitudinal_identity.py -q
          else
            echo "0.4A not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4B/C — goals and monthly focus plan (unit)
        # Also dependency-pure, and that is the point for this slice
        # specifically: the goal SUGGESTION ENGINE is deterministic and
        # offline, so it must pass in a job where no model client, no HTTP
        # library and no cloud SDK is installed. A suggestion engine that
        # needed a network would fail here rather than in review.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_goals_and_monthly_plan.py ]; then
            python -m pytest pilot_backend/tests/test_goals_and_monthly_plan.py -q
          else
            echo "0.4B/C not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5E-B — canonical-rung port (dependency-pure)
        # The PORT, with no Parent content on the path at all. That is the
        # property as much as the contract: if `pilot_backend` ever reached
        # across to read the workbook itself, this step stops importing.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_gold_standard_port.py ]; then
            python -m pytest pilot_backend/tests/test_gold_standard_port.py -q
          else
            echo "0.5E-B not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5F-A2 — baseline projection (dependency-pure)
        # The Pilot half of the trust boundary: the seven-field allowlist,
        # child resolution through the existing SourceSystemLink, idempotency
        # versus integrity, and the create-only repository. Dependency-pure
        # because the identity verifier is injected — no SDK is needed to test
        # what the boundary refuses.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_parent_baseline_projection.py ]; then
            python -m pytest \
              pilot_backend/tests/test_parent_baseline_projection.py -q
          else
            echo "0.5F-A2 not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5E-B — generation path + image separation
        # Runs in the dependency-pure job deliberately. It asserts that the
        # SERVED api image still installs exactly its three pins and copies no
        # Parent content, and that the separate GENERATION image carries the
        # workbook dependencies instead — so the two cannot silently converge.
        # Dependency-pure because the generation PATH goes through the port and
        # needs no workbook to test.
        working-directory: .
        run: |
          if [ -f pilot_runtime/tests/test_generation_job.py ]; then
            python -m pytest pilot_runtime/tests/test_generation_job.py -q
          else
            echo "0.5E-B not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5E-B — CROSS-SYSTEM canonical-rung bridge
        # The gate that cannot be faked by a mirror. It runs the LIVE adapter
        # against the real Parent 2.4 milestone workbook and the real
        # activity-family taxonomy, and asserts the whole SLP rung set is
        # accounted for: 17 built, 13 refused on an unresolved activity
        # family, 10 refused for want of a declared functional-baseline track.
        #
        # This step exists because NO OTHER JOB CAN IMPORT BOTH SIDES. The
        # Parent steps above run with `working-directory: genex-parent`, where
        # `pilot_backend` is not importable; the pilot steps run from the root,
        # where `parent_taxonomy` is not. Only `.` plus PYTHONPATH reaches
        # both.
        #
        # It belongs in THIS job rather than the integration job because the
        # dependency set it needs — pandas, openpyxl, pytest — is exactly what
        # `requirements-parent24-ci.txt` already installs here, and exactly
        # what the offline generation image installs. No firebase, no
        # firestore, no model client: a test proves the adapter imports with
        # those blocked.
        working-directory: .
        env:
          PYTHONPATH: genex-parent
        run: |
          if [ -f pilot_runtime/tests/test_parent_gold_standard_adapter.py ]; then
            python -m pytest \
              pilot_runtime/tests/test_parent_gold_standard_adapter.py -q
          else
            echo "0.5E-B not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5E-B — the bridge is not a mirror
        # An independent check on the one property the architecture was chosen
        # for. The founder rejected restating the 21 SLP rungs inside
        # pilot_backend, so NO pilot module may contain workbook content: not
        # a milestone text, not an activity-family identifier, not a rung ref.
        # Asserted over the whole pilot tree rather than the two new files,
        # because the cheapest way to "fix" a future bridge failure would be
        # to paste a rung into some other module.
        working-directory: .
        run: |
          python - <<'PY'
          import pathlib, sys

          CONTENT = (
              "says about 50 words", "calls parents mama or dada",
              "expressive_vocabulary_growth", "early_vocalizations",
              "gesture_communication", "two_word_phrases",
              "narration_storytelling", "receptive_directions_one_step",
          )
          offenders = []
          for root in ("pilot_backend", "pilot_runtime"):
              base = pathlib.Path(root)
              if not base.is_dir():
                  continue
              for path in base.rglob("*.py"):
                  # Tests legitimately name content: they assert on it.
                  if "tests" in path.parts or "fixtures" in path.parts:
                      continue
                  text = path.read_text()
                  for needle in CONTENT:
                      if needle in text:
                          offenders.append(f"{path}: {needle!r}")
          assert not offenders, (
              "workbook content is restated in non-test pilot code; it must "
              "cross the boundary at runtime:\n  " + "\n  ".join(offenders))
          print("no workbook content restated in pilot_backend/ or pilot_runtime/")
          PY

      - name: October pilot 0.4B/C — the goal layer reaches no network
        # A second, independent check on the same property: the import graph
        # of every goal and planning module, walked transitively within the
        # pilot namespace. The test above asserts it for one file; this
        # asserts nothing the engine imports pulls a client in behind it.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/goals ]; then
            echo "0.4B/C not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          roots = [pathlib.Path("pilot_backend/goals"),
                   pathlib.Path("pilot_backend/planning"),
                   pathlib.Path("pilot_backend/domain")]
          offenders = []
          for root in roots:
              for path in sorted(root.rglob("*.py")):
                  tree = ast.parse(path.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          names = [a.name.split(".")[0] for a in node.names]
                      elif isinstance(node, ast.ImportFrom):
                          names = ([node.module.split(".")[0]]
                                   if node.module and node.level == 0 else [])
                      else:
                          continue
                      hit = BANNED.intersection(names)
                      if hit:
                          offenders.append((str(path), sorted(hit)))
          assert not offenders, f"goal layer imported a client: {offenders}"
          print("goal, planning and domain modules import no network client")
          PY

      - name: October pilot 0.4D/E — weekly allocation, evidence, adaptation (unit)
        # Dependency-pure like the slices before it, and for the same reason:
        # the weekly ALLOCATOR and the ADAPTATION engine are both
        # deterministic and offline, so they must pass in a job where no
        # model client, no HTTP library and no cloud SDK is installed.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_weekly_evidence_adaptation.py ]; then
            python -m pytest pilot_backend/tests/test_weekly_evidence_adaptation.py -q
          else
            echo "0.4D/E not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4D/E — the weekly layer reaches no network
        # Extends the transitive import-graph walk to `pilot_backend/weekly`.
        # The adaptation engine must never acquire a model client by way of
        # something it imports, and a docstring promising so is not a check.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/weekly ]; then
            echo "0.4D/E not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend/weekly").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = ([node.module.split(".")[0]]
                               if node.module and node.level == 0 else [])
                  else:
                      continue
                  hit = BANNED.intersection(names)
                  if hit:
                      offenders.append((str(path), sorted(hit)))
          assert not offenders, f"weekly layer imported a client: {offenders}"
          print("weekly modules import no network client")
          PY

      - name: October pilot 0.4F/G — RTM evidence, reporting, coding (unit)
        # Dependency-pure, and that is the point for this slice: the CPT
        # coding rule set must be deterministic and offline, so it has to
        # pass in a job where no model client, HTTP library or cloud SDK is
        # installed. A coding engine that reached a network would fail here
        # rather than in review.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_rtm_evidence_reporting.py ]; then
            python -m pytest pilot_backend/tests/test_rtm_evidence_reporting.py -q
          else
            echo "0.4F/G not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4F/G — the coding rule set is isolated
        # §15: the rule set must be replaceable for a later year without
        # touching clinical or product logic. Walks the coding package's
        # imports: no service, no repository, no store, no network client.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/coding ]; then
            echo "0.4F/G not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend/coding").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".")[0] in BANNED:
                              offenders.append((str(path), alias.name))
                  elif isinstance(node, ast.ImportFrom):
                      root = (node.module or "").split(".")[0]
                      if root in BANNED:
                          offenders.append((str(path), node.module))
                      # Relative imports reach back into the application.
                      if node.level:
                          offenders.append((str(path), f"relative import level {node.level}"))
          if offenders:
              print("coding rule set is not isolated:", offenders)
              sys.exit(1)
          print("coding rule set isolated: no network client, no app import")
          PY

      - name: October pilot 0.4F/G — no payer, insurance or claim-billing model
        # §23. Token-level over the RTM layer, so prose cannot trip it and an
        # identifier cannot hide behind one. `claim` alone is NOT banned: it
        # is the 0.4A uniqueness mutex, a different sense of the word, and
        # the unit suite asserts positively that every claim token in the RTM
        # layer is that primitive.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/rtm.py ]; then
            echo "0.4F/G not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"member_id", "policy_number", "group_number",
                    "insurance_plan", "insurance", "payer_id", "payer",
                    "eligibility_status", "benefit_status", "benefits",
                    "allowed_amount", "reimbursement_amount", "reimbursement",
                    "claim_status", "claim_number", "claim_amount",
                    "insurance_claim", "claim_submission", "clearinghouse",
                    "copay", "deductible", "coinsurance", "remittance"}
          MODULES = ["pilot_backend/domain/rtm.py",
                     "pilot_backend/domain/rtm_documentation.py",
                     "pilot_backend/domain/rtm_summary.py",
                     "pilot_backend/domain/month_end.py",
                     "pilot_backend/coding/rules.py",
                     "pilot_backend/rtm/service.py",
                     "pilot_backend/rtm/evidence.py",
                     "pilot_backend/rtm/reporting.py"]
          offenders = []
          for relative in MODULES:
              tree = ast.parse(pathlib.Path(relative).read_text())
              names = {n.id for n in ast.walk(tree) if isinstance(n, ast.Name)}
              names |= {n.attr for n in ast.walk(tree) if isinstance(n, ast.Attribute)}
              names |= {n.arg for n in ast.walk(tree) if isinstance(n, ast.arg)}
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                      names.add(node.name)
              hit = BANNED & {n.lower() for n in names}
              if hit:
                  offenders.append((relative, sorted(hit)))
          # PayerVerification must not exist anywhere in the pilot.
          for path in sorted(pathlib.Path("pilot_backend").rglob("*.py")):
              if path.name.startswith("test_"):
                  continue
              classes = {n.name for n in ast.walk(ast.parse(path.read_text()))
                         if isinstance(n, ast.ClassDef)}
              if "PayerVerification" in classes:
                  offenders.append((str(path), ["PayerVerification"]))
          if offenders:
              print("payer/billing vocabulary present:", offenders)
              sys.exit(1)
          print("no payer, insurance or claim-billing vocabulary in the RTM layer")
          PY

      - name: October pilot 0.5A — authenticated identity and Parent bridge (unit)
        # Dependency-pure, deliberately: the whole 0.5A identity surface —
        # subject claim, caregiver bootstrap, legacy backfill, the four HTTP
        # routes — must pass in a job where no cloud SDK is installed. The
        # Parent boundary is a Protocol here; the GCS adapter lives in
        # pilot_runtime and is gated in the integration job.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_integration_identity.py ]; then
            python -m pytest pilot_backend/tests/test_integration_identity.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5A — the subject claim is create-only
        # An app identity is permanent: a subject is bound to one actor for the
        # lifetime of the record and no product operation unbinds it. A release
        # or update path would be the route by which a subject could be
        # silently re-pointed at a different person, so its ABSENCE is gated
        # rather than merely documented.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/auth_identity.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          tree = ast.parse(pathlib.Path(
              "pilot_backend/persistence/firestore_repos.py").read_text())
          target = next(
              (n for n in ast.walk(tree)
               if isinstance(n, ast.ClassDef)
               and n.name == "FirestoreAuthSubjectClaimRepository"), None)
          if target is None:
              print("FirestoreAuthSubjectClaimRepository is missing")
              sys.exit(1)
          methods = sorted(n.name for n in target.body
                           if isinstance(n, ast.FunctionDef)
                           and not n.name.startswith("_"))
          if methods != ["claim", "find_for_subject", "get_by_id"]:
              print("subject-claim repository gained an operation:", methods)
              sys.exit(1)

          # And the record carries no generation counter: the 0.4A claims have
          # one because their keys get RELEASED, and this one must not acquire
          # the hook for an unreviewed re-binding feature.
          claim_tree = ast.parse(pathlib.Path(
              "pilot_backend/domain/auth_identity.py").read_text())
          record = next(n for n in ast.walk(claim_tree)
                        if isinstance(n, ast.ClassDef)
                        and n.name == "AuthSubjectIdentityClaim")
          fields = [n.target.id for n in record.body
                    if isinstance(n, ast.AnnAssign)
                    and isinstance(n.target, ast.Name)]
          if any("generation" in name for name in fields):
              print("the subject claim gained a generation counter:", fields)
              sys.exit(1)
          print("subject claim is create-only, with no generation counter")
          PY

      - name: October pilot 0.5A — the raw auth subject is never an audit key
        # The fingerprint exists precisely so there is no reason to allowlist
        # an account identifier. `actor_auth_subject` is a top-level AuditEvent
        # field that has held the ACTING principal's own subject since 0.2 and
        # is out of scope here; what this gates is METADATA.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/auth_identity.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.audit.events import ALLOWED_METADATA_KEYS

          banned = {"auth_subject", "subject", "uid", "email", "owner_uid",
                    "session_id", "parent_session_id", "external_id",
                    "display_name"}
