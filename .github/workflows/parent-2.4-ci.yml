        # 0.1-0.5B read NO request body, because a body is the one place a
        # forged actor id can arrive. 0.5C must accept content, so the rule
        # became "one function, explicit per-route allowlist". This asserts no
        # route allowlist contains an identity field, over the AST of every
        # `read_json_body` call site — the guard that keeps the widening safe.
        run: |
          if [ ! -f pilot_backend/transport/body.py ]; then
            echo "0.5C not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys
          from pilot_backend.transport.body import IDENTITY_FIELDS

          for required in ("auth_subject", "role", "actor_id", "caregiver_id",
                           "provider_id", "child_id"):
              if required not in IDENTITY_FIELDS:
                  print("IDENTITY_FIELDS lost a field:", required)
                  sys.exit(1)

          tree = ast.parse(pathlib.Path(
              "pilot_backend/transport/wsgi_app.py").read_text())
          sites = offenders = 0
          for node in ast.walk(tree):
              if not (isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Name)
                      and node.func.id == "read_json_body"):
                  continue
              sites += 1
              for keyword in node.keywords:
                  if keyword.arg not in {"allowed", "required"}:
                      continue
                  if not isinstance(keyword.value, (ast.List, ast.Tuple)):
                      continue
                  for element in keyword.value.elts:
                      if (isinstance(element, ast.Constant)
                              and element.value in IDENTITY_FIELDS):
                          print("route allowlists identity:", element.value)
                          offenders += 1
          if offenders:
              sys.exit(1)
          if sites == 0:
              print("no read_json_body call sites found — the guard is vacuous")
              sys.exit(1)
          print(f"{sites} body call sites; none allowlists an identity field")
          PY

