name: Parent 2.4 CI

# Hosted gate for the Parent 2.4 taxonomy lineage.
#
# Test-only. No GCP/Firebase auth, no secrets, no deploy, no Terraform, no Cloud
# Run, no therapist-service access, no real data. Reads the frozen Gold Standard
# workbook and writes only to a temporary directory.
#
# Scope note: this workflow deliberately does NOT run
# therapist_api/tests/test_repo_integrity.py. Two of its tests
# (test_worktree_is_on_therapist_branch, test_therapist_commits_touch_only_
# therapist_paths) are scoped to the therapist workstream and fail on a Parent
# branch by construction. They are correct as written and remain unmodified;
# genex-parent/tests/test_parent_24_integrity.py is the Parent-scoped
# equivalent. The therapist workflow is untouched and still gates its own
# branches.

on:
  push:
    branches:
      - "feature/parent-2.4-*"
      # October pilot lineage. Branches from the Parent 2.4 freeze and carries
      # the shared pilot_backend/ namespace, so it must run the SAME Parent
      # gates — a shared identity model that breaks the Brain is still broken.
      - "feature/october-pilot-*"
  pull_request:
    paths:
      - "genex-parent/**"
      - "pilot_backend/**"
      - ".github/workflows/parent-2.4-ci.yml"

permissions:
  contents: read

jobs:
  taxonomy:
    name: Parent 2.4 taxonomy + integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genex-parent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the Parent integrity checks compare object
          # hashes against beta-2.1-freeze and diff against
          # parent-2.4-0.2-taxonomy-foundation. A shallow checkout would make
          # those tests SKIP instead of run. Read-only; no credentials persisted.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI-only dependencies
        # Exact pins — see requirements-parent24-ci.txt for why the application
        # requirements.txt is deliberately NOT used here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parent24-ci.txt
          pip list

      - name: Python compilation (taxonomy package + Brain + Parent 2.4 tests)
        run: |
          python -m compileall -q parent_taxonomy genex_core \
            tests/test_parent_24_taxonomy.py \
            tests/test_parent_24_integrity.py \
            tests/test_parent_24_seven_domain_brain.py \
            tests/test_parent_24_activity_families.py \
            tests/test_parent_24_repair_pass1.py \
            tests/test_parent_24_repair_pass2.py \
            tests/test_parent_24_regression_nonvacuity.py \
            tests/test_parent_24_domain_compat.py \
            tests/test_parent_24_daily_living.py \
            tests/test_parent_24_functional_baseline.py \
            tests/test_regression.py

      - name: Taxonomy package imports with stdlib only
        # The canonical vocabulary must stay usable by consumers that must not
        # drag pandas in. Proven by blocking the third-party modules outright.
        run: |
          python - <<'PY'
          import sys
          BLOCKED = {"pandas", "numpy", "openpyxl"}
          class Blocker:
              def find_module(self, name, path=None):
                  return self if name.split(".")[0] in BLOCKED else None
              def load_module(self, name):
                  raise ImportError(f"BLOCKED: {name}")
          sys.meta_path.insert(0, Blocker())
          sys.path.insert(0, ".")
          import parent_taxonomy
          from parent_taxonomy import activity_families, domains, subdomain_map
          assert len(domains.DOMAINS) == 7, domains.DOMAIN_KEYS
          assert len(subdomain_map.SUBDOMAIN_TO_DOMAIN) == 24
          # activity_families reads a workbook, so it must keep pandas/openpyxl
          # function-local. Importing it here under the blocker proves that.
          assert activity_families.EXPECTED_FAMILY_COUNT == 56
          print("stdlib-only import OK: 7 domains, 24 subdomains, activity_families")
          PY

      - name: Frozen Gold Standard provenance
        run: |
          python - <<'PY'
          import hashlib, pathlib
          EXPECTED = "c2b6735d9f099c916973c98c1953e7eb1f2ca8e1a60430011f805a3bf9c3487c"
          p = pathlib.Path("data/cdc_milestones_with_bridges_family_cleaned_final_app_ready.xlsx")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == EXPECTED, f"Gold Standard changed: {got}"
          print("Gold Standard SHA OK:", got)
          PY

      - name: Parent 2.4 taxonomy tests
        run: python -m pytest tests/test_parent_24_taxonomy.py -q

      - name: Parent 2.4 workstream integrity
        run: python -m pytest tests/test_parent_24_integrity.py -q

      - name: Parent 2.4 seven-domain Brain (Phase 0.3B)
        run: python -m pytest tests/test_parent_24_seven_domain_brain.py -q

      - name: Parent 2.4 activity-family taxonomy + validator (Phase 0.3B)
        run: python -m pytest tests/test_parent_24_activity_families.py -q

      - name: Parent 2.4 runtime repair pass 1 (canonical safety + legacy keys)
        run: python -m pytest tests/test_parent_24_repair_pass1.py -q

      - name: Parent 2.4 runtime repair pass 2 (founder decisions)
        run: python -m pytest tests/test_parent_24_repair_pass2.py -q

      - name: Parent 2.4 regression non-vacuity guard
        # A legacy domain key yields zero questions and zero activities, so a
        # test that feeds one and iterates asserts NOTHING and still reports
        # success. Ten regression tests were green for exactly that reason.
        # This guard fails loudly instead of going quiet.
        run: python -m pytest tests/test_parent_24_regression_nonvacuity.py -q

      - name: Parent 2.4 API consumer + legacy read compatibility (Phase 0.3C)
        # The four-area API focus surface is kept for compatibility, so a legacy
        # key can still reach the Brain — which returns NOTHING for one, without
        # raising. These gate the projection at that boundary, and in particular
        # that an ambiguous legacy movement_and_physical record is never guessed.
        run: python -m pytest tests/test_parent_24_domain_compat.py -q

      - name: Parent 2.4 Daily Living activity generation
        # Daily Living planned correctly but produced ZERO usable activities:
        # its buckets had no curated cards, so every card fell through to the
        # generic template the validator blocks. Repaired with content, not by
        # relaxing validation — this suite pins BOTH halves, so it fails if the
        # skills stop generating cards AND if anyone softens the placeholder
        # rule to make them pass. It also holds cup_drinking and
        # feeding_self_regulation closed pending clinical review.
        run: python -m pytest tests/test_parent_24_daily_living.py -q

      - name: Parent 2.4 deterministic functional baseline
        # A structured entry step before the estimator. Gated because the suite
        # pins properties that fail silently if broken: the baseline must stay
        # LLM-free and deterministic, "Not sure" and a missing answer must never
        # become the legacy six-month dev_age, and calibration must stay on one
        # coherent skill track so an uneven-but-normal profile is never read as
        # a contradiction. It also holds Daily Living "Not sure" to UNRESOLVED.
        run: python -m pytest tests/test_parent_24_functional_baseline.py -q

      - name: October pilot backend — identity foundation
        # Runs from the repository root, not genex-parent/, because
        # pilot_backend/ is a top-level shared namespace (Parent + Therapist +
        # later RTM). Needs only pytest and the standard library — no new
        # dependency, and deliberately no database driver or auth SDK.
        #
        # Skipped automatically on branches that predate the pilot so the
        # existing Parent 2.4 branches keep passing unchanged.
        working-directory: .
        run: |
          if [ -d pilot_backend ]; then
            python -m pytest pilot_backend/tests -q
          else
            echo "pilot_backend/ not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4A — longitudinal identity (unit)
        # Runs in the DEPENDENCY-PURE job on purpose: the identity domain,
        # claims and service import no SDK, and proving that here is what
        # keeps the pilot_backend/pilot_runtime split honest.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_longitudinal_identity.py ]; then
            python -m pytest pilot_backend/tests/test_longitudinal_identity.py -q
          else
            echo "0.4A not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4B/C — goals and monthly focus plan (unit)
        # Also dependency-pure, and that is the point for this slice
        # specifically: the goal SUGGESTION ENGINE is deterministic and
        # offline, so it must pass in a job where no model client, no HTTP
        # library and no cloud SDK is installed. A suggestion engine that
        # needed a network would fail here rather than in review.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_goals_and_monthly_plan.py ]; then
            python -m pytest pilot_backend/tests/test_goals_and_monthly_plan.py -q
          else
            echo "0.4B/C not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4B/C — the goal layer reaches no network
        # A second, independent check on the same property: the import graph
        # of every goal and planning module, walked transitively within the
        # pilot namespace. The test above asserts it for one file; this
        # asserts nothing the engine imports pulls a client in behind it.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/goals ]; then
            echo "0.4B/C not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          roots = [pathlib.Path("pilot_backend/goals"),
                   pathlib.Path("pilot_backend/planning"),
                   pathlib.Path("pilot_backend/domain")]
          offenders = []
          for root in roots:
              for path in sorted(root.rglob("*.py")):
                  tree = ast.parse(path.read_text())
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          names = [a.name.split(".")[0] for a in node.names]
                      elif isinstance(node, ast.ImportFrom):
                          names = ([node.module.split(".")[0]]
                                   if node.module and node.level == 0 else [])
                      else:
                          continue
                      hit = BANNED.intersection(names)
                      if hit:
                          offenders.append((str(path), sorted(hit)))
          assert not offenders, f"goal layer imported a client: {offenders}"
          print("goal, planning and domain modules import no network client")
          PY

      - name: October pilot 0.4D/E — weekly allocation, evidence, adaptation (unit)
        # Dependency-pure like the slices before it, and for the same reason:
        # the weekly ALLOCATOR and the ADAPTATION engine are both
        # deterministic and offline, so they must pass in a job where no
        # model client, no HTTP library and no cloud SDK is installed.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_weekly_evidence_adaptation.py ]; then
            python -m pytest pilot_backend/tests/test_weekly_evidence_adaptation.py -q
          else
            echo "0.4D/E not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4D/E — the weekly layer reaches no network
        # Extends the transitive import-graph walk to `pilot_backend/weekly`.
        # The adaptation engine must never acquire a model client by way of
        # something it imports, and a docstring promising so is not a check.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/weekly ]; then
            echo "0.4D/E not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend/weekly").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = ([node.module.split(".")[0]]
                               if node.module and node.level == 0 else [])
                  else:
                      continue
                  hit = BANNED.intersection(names)
                  if hit:
                      offenders.append((str(path), sorted(hit)))
          assert not offenders, f"weekly layer imported a client: {offenders}"
          print("weekly modules import no network client")
          PY

      - name: October pilot 0.4F/G — RTM evidence, reporting, coding (unit)
        # Dependency-pure, and that is the point for this slice: the CPT
        # coding rule set must be deterministic and offline, so it has to
        # pass in a job where no model client, HTTP library or cloud SDK is
        # installed. A coding engine that reached a network would fail here
        # rather than in review.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_rtm_evidence_reporting.py ]; then
            python -m pytest pilot_backend/tests/test_rtm_evidence_reporting.py -q
          else
            echo "0.4F/G not present on this branch — nothing to run"
          fi

      - name: October pilot 0.4F/G — the coding rule set is isolated
        # §15: the rule set must be replaceable for a later year without
        # touching clinical or product logic. Walks the coding package's
        # imports: no service, no repository, no store, no network client.
        working-directory: .
        run: |
          if [ ! -d pilot_backend/coding ]; then
            echo "0.4F/G not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"requests", "httpx", "urllib", "urllib3", "http", "socket",
                    "openai", "anthropic", "google", "vertexai", "aiohttp",
                    "firebase_admin", "grpc"}
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend/coding").rglob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".")[0] in BANNED:
                              offenders.append((str(path), alias.name))
                  elif isinstance(node, ast.ImportFrom):
                      root = (node.module or "").split(".")[0]
                      if root in BANNED:
                          offenders.append((str(path), node.module))
                      # Relative imports reach back into the application.
                      if node.level:
                          offenders.append((str(path), f"relative import level {node.level}"))
          if offenders:
              print("coding rule set is not isolated:", offenders)
              sys.exit(1)
          print("coding rule set isolated: no network client, no app import")
          PY

      - name: October pilot 0.4F/G — no payer, insurance or claim-billing model
        # §23. Token-level over the RTM layer, so prose cannot trip it and an
        # identifier cannot hide behind one. `claim` alone is NOT banned: it
        # is the 0.4A uniqueness mutex, a different sense of the word, and
        # the unit suite asserts positively that every claim token in the RTM
        # layer is that primitive.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/rtm.py ]; then
            echo "0.4F/G not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          BANNED = {"member_id", "policy_number", "group_number",
                    "insurance_plan", "insurance", "payer_id", "payer",
                    "eligibility_status", "benefit_status", "benefits",
                    "allowed_amount", "reimbursement_amount", "reimbursement",
                    "claim_status", "claim_number", "claim_amount",
                    "insurance_claim", "claim_submission", "clearinghouse",
                    "copay", "deductible", "coinsurance", "remittance"}
          MODULES = ["pilot_backend/domain/rtm.py",
                     "pilot_backend/domain/rtm_documentation.py",
                     "pilot_backend/domain/rtm_summary.py",
                     "pilot_backend/domain/month_end.py",
                     "pilot_backend/coding/rules.py",
                     "pilot_backend/rtm/service.py",
                     "pilot_backend/rtm/evidence.py",
                     "pilot_backend/rtm/reporting.py"]
          offenders = []
          for relative in MODULES:
              tree = ast.parse(pathlib.Path(relative).read_text())
              names = {n.id for n in ast.walk(tree) if isinstance(n, ast.Name)}
              names |= {n.attr for n in ast.walk(tree) if isinstance(n, ast.Attribute)}
              names |= {n.arg for n in ast.walk(tree) if isinstance(n, ast.arg)}
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                      names.add(node.name)
              hit = BANNED & {n.lower() for n in names}
              if hit:
                  offenders.append((relative, sorted(hit)))
          # PayerVerification must not exist anywhere in the pilot.
          for path in sorted(pathlib.Path("pilot_backend").rglob("*.py")):
              if path.name.startswith("test_"):
                  continue
              classes = {n.name for n in ast.walk(ast.parse(path.read_text()))
                         if isinstance(n, ast.ClassDef)}
              if "PayerVerification" in classes:
                  offenders.append((str(path), ["PayerVerification"]))
          if offenders:
              print("payer/billing vocabulary present:", offenders)
              sys.exit(1)
          print("no payer, insurance or claim-billing vocabulary in the RTM layer")
          PY

      - name: October pilot 0.5A — authenticated identity and Parent bridge (unit)
        # Dependency-pure, deliberately: the whole 0.5A identity surface —
        # subject claim, caregiver bootstrap, legacy backfill, the four HTTP
        # routes — must pass in a job where no cloud SDK is installed. The
        # Parent boundary is a Protocol here; the GCS adapter lives in
        # pilot_runtime and is gated in the integration job.
        working-directory: .
        run: |
          if [ -f pilot_backend/tests/test_integration_identity.py ]; then
            python -m pytest pilot_backend/tests/test_integration_identity.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5A — the subject claim is create-only
        # An app identity is permanent: a subject is bound to one actor for the
        # lifetime of the record and no product operation unbinds it. A release
        # or update path would be the route by which a subject could be
        # silently re-pointed at a different person, so its ABSENCE is gated
        # rather than merely documented.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/auth_identity.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          tree = ast.parse(pathlib.Path(
              "pilot_backend/persistence/firestore_repos.py").read_text())
          target = next(
              (n for n in ast.walk(tree)
               if isinstance(n, ast.ClassDef)
               and n.name == "FirestoreAuthSubjectClaimRepository"), None)
          if target is None:
              print("FirestoreAuthSubjectClaimRepository is missing")
              sys.exit(1)
          methods = sorted(n.name for n in target.body
                           if isinstance(n, ast.FunctionDef)
                           and not n.name.startswith("_"))
          if methods != ["claim", "find_for_subject", "get_by_id"]:
              print("subject-claim repository gained an operation:", methods)
              sys.exit(1)

          # And the record carries no generation counter: the 0.4A claims have
          # one because their keys get RELEASED, and this one must not acquire
          # the hook for an unreviewed re-binding feature.
          claim_tree = ast.parse(pathlib.Path(
              "pilot_backend/domain/auth_identity.py").read_text())
          record = next(n for n in ast.walk(claim_tree)
                        if isinstance(n, ast.ClassDef)
                        and n.name == "AuthSubjectIdentityClaim")
          fields = [n.target.id for n in record.body
                    if isinstance(n, ast.AnnAssign)
                    and isinstance(n.target, ast.Name)]
          if any("generation" in name for name in fields):
              print("the subject claim gained a generation counter:", fields)
              sys.exit(1)
          print("subject claim is create-only, with no generation counter")
          PY

      - name: October pilot 0.5A — the raw auth subject is never an audit key
        # The fingerprint exists precisely so there is no reason to allowlist
        # an account identifier. `actor_auth_subject` is a top-level AuditEvent
        # field that has held the ACTING principal's own subject since 0.2 and
        # is out of scope here; what this gates is METADATA.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/domain/auth_identity.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.audit.events import ALLOWED_METADATA_KEYS

          banned = {"auth_subject", "subject", "uid", "email", "owner_uid",
                    "session_id", "parent_session_id", "external_id",
                    "display_name"}
          present = sorted(banned & set(ALLOWED_METADATA_KEYS))
          if present:
              print("account or external identifiers are allowlisted:", present)
              sys.exit(1)
          required = {"subject_fingerprint", "holder_actor_type",
                      "caregiver_id", "integration_state"}
          missing = sorted(required - set(ALLOWED_METADATA_KEYS))
          if missing:
              print("0.5A metadata keys are not registered:", missing)
              sys.exit(1)
          print("audit metadata carries a fingerprint and no account identifier")
          PY

      - name: October pilot 0.5A — the identity routes are protected
        # `/health` must remain the only unauthenticated path. Derived from
        # ROUTE_TABLE rather than restated, so this cannot pass by agreeing
        # with a stale copy of the list.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/integration/identity_service.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.apisurface.surface import PUBLIC_ROUTES
          from pilot_backend.transport.wsgi_app import ROUTE_TABLE, route_templates

          public = {t for _m, t, is_public in ROUTE_TABLE if is_public}
          if public != {"/health"} or set(PUBLIC_ROUTES) != {"/health"}:
              print("the public surface changed:", public, set(PUBLIC_ROUTES))
              sys.exit(1)
          served = route_templates()   # asserts ROUTE_TABLE agrees with apisurface
          for route in ("/pilot/me", "/pilot/me/children",
                        "/pilot/bootstrap/caregiver",
                        "/pilot/parent-sessions/{session_id}/link-child"):
              if served.get(route) is not False:
                  print("0.5A route is missing or public:", route)
                  sys.exit(1)
          print("four 0.5A routes served, all protected; /health still the only public path")
          PY

      - name: October pilot 0.5A — the session bridge is one transaction
        # The defect the real emulator caught: an earlier revision created the
        # Child and the relationship BEFORE acquiring the 0.4A source-link
        # claim, so eight concurrent links left seven orphan children with
        # ACTIVE caregiver relationships — visible in /pilot/me/children.
        # Every write must sit inside the transaction, and the claims first.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/integration/identity_service.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          tree = ast.parse(pathlib.Path(
              "pilot_backend/integration/identity_service.py").read_text())
          link = next(n for n in ast.walk(tree)
                      if isinstance(n, ast.FunctionDef)
                      and n.name == "link_parent_session")
          bridge = next((n for n in ast.walk(link)
                         if isinstance(n, ast.FunctionDef)
                         and n.name == "_bridge"), None)
          if bridge is None:
              print("link_parent_session no longer has a transaction body")
              sys.exit(1)

          inside = [(ast.unparse(n.func), n.lineno) for n in ast.walk(bridge)
                    if isinstance(n, ast.Call)
                    and isinstance(n.func, ast.Attribute)]
          names = [name for name, _line in inside]
          for required in ("tx.identity_claims.claim", "tx.children.create",
                           "tx.caregiver_child.connect", "tx.source_links.create"):
              if required not in names:
                  print("write is not inside the transaction:", required)
                  sys.exit(1)

          # Claims FIRST, so a loser writes nothing at all.
          first_claim = min(l for n, l in inside if n == "tx.identity_claims.claim")
          first_write = min(l for n, l in inside
                            if n in ("tx.children.create",
                                     "tx.caregiver_child.connect",
                                     "tx.source_links.create"))
          if first_claim > first_write:
              print("a record is written before a uniqueness claim is taken")
              sys.exit(1)

          # And no write escapes to the non-transactional repositories inside
          # the bridge — that is exactly how the orphan window was opened.
          for name, _line in inside:
              if name.startswith("self._repos.") and name.rsplit(".", 1)[-1] in (
                      "create", "connect", "claim"):
                  print("a write bypasses the transaction:", name)
                  sys.exit(1)
          print("child, relationship, link and both claims commit together; claims first")
          PY

      - name: October pilot 0.5A — pilot_backend still imports no storage SDK
        # Ports not SDKs. The Parent GCS adapter lives in pilot_runtime; the
        # core stays dependency-pure. Parsed with ast, not grepped — several
        # modules NAME these libraries in docstrings to explain which boundary
        # they sit behind, and a substring scan reads those as violations.
        working-directory: .
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          banned = {"google", "firebase_admin", "requests", "httpx", "boto3",
                    "aiohttp", "urllib"}
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend").rglob("*.py")):
              if "tests" in path.parts:
                  continue
              for node in ast.walk(ast.parse(path.read_text())):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  for name in names:
                      if name.split(".")[0] in banned:
                          offenders.append((str(path), name))
          if offenders:
              print("pilot_backend imports an SDK:", offenders)
              sys.exit(1)
          print("pilot_backend imports no storage, network or identity SDK")
          PY

      - name: October pilot 0.5B — provider connection lifecycle (unit)
        # The state machine and the authorization rules. Concurrency is NOT
        # proven here — `FakeDocumentStore` is a plain dict — it is proven in
        # the pilot-integration job against the real emulator.
        run: |
          if [ -f pilot_backend/tests/test_provider_connection.py ]; then
            python -m pytest pilot_backend/tests/test_provider_connection.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5B — connection surface over real HTTP
        # Role separation, cross-family isolation and non-enumeration proven
        # through actual request handling rather than service calls.
        run: |
          if [ -f pilot_backend/tests/test_provider_connection_http.py ]; then
            python -m pytest pilot_backend/tests/test_provider_connection_http.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: October pilot 0.5B — Provider creation goes through the claim
        # THE structural half of PRE-PHI blocker 4. A deterministic claim is
        # only a mutex for writers that TAKE it, so the guarantee is not
        # "provisioning acquires the claim" but "nothing else creates a
        # Provider". Asserted over the AST, because a future service calling
        # the repository directly would reopen the blocker and no behavioural
        # test would notice.
        run: |
          if [ ! -d pilot_backend/provisioning ]; then
            echo "0.5B not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          root = pathlib.Path("pilot_backend")
          creators, claimers = set(), set()
          for path in sorted(root.rglob("*.py")):
              if "tests" in path.parts:
                  continue
              tree = ast.parse(path.read_text())
              rel = path.relative_to(root).as_posix()
              for node in ast.walk(tree):
                  if (isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Attribute)
                          and node.func.attr == "create"
                          and isinstance(node.func.value, ast.Attribute)
                          and node.func.value.attr == "providers"):
                      creators.add(rel)
                  if (isinstance(node, ast.Attribute) and node.attr == "claim"
                          and isinstance(node.value, ast.Attribute)
                          and node.value.attr == "auth_subject_claims"):
                      claimers.add(rel)

          allowed_creators = {"provisioning/service.py",
                              "fixtures/secure_topology.py",
                              "fixtures/pilot_topology.py"}
          if creators != allowed_creators:
              print("Provider creation moved:", sorted(creators))
              sys.exit(1)
          if claimers != {"integration/identity_service.py",
                          "provisioning/service.py"}:
              print("the subject claim gained a writer:", sorted(claimers))
              sys.exit(1)
          print("provider creation: provisioning only, plus two test-only "
                "fixtures; subject claim written from exactly two paths")
          PY

      - name: October pilot 0.5B — no discovery, directory or self-registration
        # The DEFERRED surfaces must stay absent. Each discloses which
        # families or clinicians exist, so their absence is a security
        # property rather than a backlog item. Provisioning has no route
        # either: creating a Provider is an administrative act and `ActorRole`
        # has no principal that could authorize it, so an endpoint for it
        # would have to authorize nobody — which IS public self-registration.
        run: |
          if [ ! -f pilot_backend/connections/service.py ]; then
            echo "0.5B not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.transport.wsgi_app import ROUTE_TABLE

          banned = ("search", "directory", "lookup", "register", "signup",
                    "sign-up", "invite-family", "families", "discover")
          for _method, template, _public in ROUTE_TABLE:
              low = template.lower()
              for fragment in banned:
                  if fragment in low:
                      print("a discovery-shaped route appeared:", template)
                      sys.exit(1)
              if low.rstrip("/").endswith("providers"):
                  print("a provider-collection route appeared:", template)
                  sys.exit(1)
          public = [t for _m, t, p in ROUTE_TABLE if p]
          if public != ["/health"]:
              print("a 0.5B route is public:", public)
              sys.exit(1)
          print(f"{len(ROUTE_TABLE)} routes; /health still the only public one; "
                "no discovery, directory, provisioning or self-registration route")
          PY

      - name: October pilot 0.5B — an inactive connection grants nothing
        # PENDING, DECLINED, PAUSED, REVOKED and ENDED must all deny, and the
        # reason they do is structural: `authorize_child_access` tests
        # `is_active`, which requires status ACTIVE *and* `ended_at` unset. So
        # the assertion is on the ENUM and the predicate, not on a list of
        # states someone has to remember to extend.
        run: |
          if [ ! -f pilot_backend/connections/service.py ]; then
            echo "0.5B not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from datetime import datetime, timezone
          from pilot_backend.domain.connections import ProviderChildConnection
          from pilot_backend.domain.enums import (
              ConnectionStatus, NON_ACCESS_CONNECTION_STATUSES)

          T0 = datetime(2026, 10, 1, 12, 0, tzinfo=timezone.utc)
          if ConnectionStatus.ACTIVE in NON_ACCESS_CONNECTION_STATUSES:
              print("ACTIVE is listed as a non-access status")
              sys.exit(1)
          for status in ConnectionStatus:
              row = ProviderChildConnection(
                  connection_id="pcxn_x", provider_id="prov_x",
                  child_id="chld_x", practice_id="prac_x", status=status,
                  created_at=T0, updated_at=T0)
              expected = status is ConnectionStatus.ACTIVE
              if row.is_active is not expected:
                  print(f"{status.value}: is_active={row.is_active}")
                  sys.exit(1)
          # And an ACTIVE row that has been ended is still not active.
          ended = ProviderChildConnection(
              connection_id="pcxn_y", provider_id="prov_x", child_id="chld_x",
              practice_id="prac_x", status=ConnectionStatus.ACTIVE,
              created_at=T0, updated_at=T0, ended_at=T0)
          if ended.is_active:
              print("an ended ACTIVE row still reports itself active")
              sys.exit(1)
          print(f"only ACTIVE authorizes; {len(NON_ACCESS_CONNECTION_STATUSES)} "
                "statuses deny, including DECLINED and PAUSED")
          PY

      - name: October pilot 0.4D/E — no double counting, structurally
        # The arithmetic that stops a multi-goal activity inflating a total.
        # Asserted here as well as in the unit suite because it is the single
        # property a future MonthEndReport will lean on hardest: a refactor
        # that "simplified" the total into a sum of per-goal streams would
        # otherwise only surface in F/G, by which point reports exist.
        working-directory: .
        run: |
          if [ ! -f pilot_backend/weekly/counting.py ]; then
            echo "0.4D/E not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib

          tree = ast.parse(pathlib.Path("pilot_backend/weekly/counting.py").read_text())
          summarize = next(n for n in ast.walk(tree)
                           if isinstance(n, ast.FunctionDef)
                           and n.name == "summarize")
          assigned = [kw for node in ast.walk(summarize)
                      if isinstance(node, ast.Call)
                      for kw in node.keywords if kw.arg == "total_attempts"]
          assert len(assigned) == 1, "total_attempts must be computed exactly once"
          rendered = ast.dump(assigned[0].value)
          assert "seen_events" in rendered, rendered
          assert "per_goal" not in rendered, "total derived from goal streams"
          print("total attempts counts distinct events, not summed goal streams")
          PY

      - name: Parent regression suite (seven-domain vocabulary)
        # Now part of the hosted gate. It exercises the Brain end to end —
        # focus selection, bridge plans, activity banks, safety and the weekly
        # schedule — and is what caught the 0.3B runtime regressions.
        run: python -m pytest tests/test_regression.py -q

      - name: Activity-family taxonomy provenance
        # The founder-reviewed workbook is the source of truth for activity
        # family -> allowed domain. Pinned so a silent content edit fails the
        # gate rather than quietly changing which activity cards are blocked.
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          sys.path.insert(0, ".")
          EXPECTED = "9165c653be075c560bfb957beba29c5780fc358737740d3558ab64b6451be30e"
          p = pathlib.Path("data/parent_2_4/activity_family_taxonomy_v1.xlsx")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == EXPECTED, f"activity-family taxonomy changed: {got}"

          from parent_taxonomy.activity_families import get_taxonomy
          from parent_taxonomy.domains import BY_KEY
          t = get_taxonomy()
          assert len(t.families) == 56, len(t.families)

          counts = {}
          for e in t.families.values():
              counts[e.primary_domain] = counts.get(e.primary_domain, 0) + 1
          assert counts == {
              "talking_and_communicating": 17,
              "social_and_emotional": 12,
              "learning_and_thinking": 9,
              "gross_motor": 7,
              "fine_motor": 6,
              "daily_living": 5,
          }, counts
          assert "sensory" not in counts, "sensory is content-pending"

          # Allowed domains must stay DERIVED, and every domain canonical.
          for e in t.families.values():
              assert e.allowed_domains == frozenset(
                  (e.primary_domain, *e.secondary_domains)
              ), e.key
              assert e.allowed_domains <= set(BY_KEY), e.key
          assert sum(1 for e in t.families.values() if e.secondary_domains) == 27

          # The retired dict must not come back.
          from genex_core import activity_validator
          assert not hasattr(activity_validator, "FAMILY_TO_CATEGORY"), \
              "FAMILY_TO_CATEGORY was re-created"

          print("activity-family taxonomy OK:", got)
          print("  56 families,", counts, "| 27 with secondary domains")
          PY

      - name: Frozen PARENT-0.2 contract summary
        # Derives the canonical counts from the workbook and asserts the frozen
        # contract. Independent of the test suite so the gate still fails loudly
        # if a test were ever removed.
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, ".")
          from parent_taxonomy import domains as D, migrate as M, subdomain_map as S
          import pandas as pd

          SRC = pathlib.Path(
              "data/cdc_milestones_with_bridges_family_cleaned_final_app_ready.xlsx"
          )
          EXPECTED = {
              "talking_and_communicating": 83,
              "social_and_emotional": 89,
              "learning_and_thinking": 84,
              "fine_motor": 29,
              "gross_motor": 49,
              "daily_living": 35,
              "sensory": 0,
          }

          assert D.DOMAIN_KEYS == tuple(EXPECTED), D.DOMAIN_KEYS
          assert "movement_and_physical" not in D.DOMAIN_KEYS
          assert D.is_legacy("movement_and_physical")
          assert D.resolve_legacy_domain("movement_and_physical") is None
          assert D.get("sensory").content_status is D.ContentStatus.PENDING

          df = pd.read_excel(SRC, sheet_name=M.MAIN_SHEET, dtype=str)
          assert len(df) == 369, len(df)
          assert set(df["subdomain"]) == S.mapped_subdomains()
          assert len(S.SUBDOMAIN_TO_DOMAIN) == 24

          counts = M.domain_counts(SRC)
          assert counts == EXPECTED, counts
          assert sum(counts.values()) == 369

          for bad in ("", "   ", "not_a_subdomain"):
              try:
                  S.resolve(bad)
              except S.SubdomainMappingError:
                  pass
              else:
                  raise AssertionError(f"did not fail closed on {bad!r}")

          print("PARENT-0.2 contract OK:", counts, "total", sum(counts.values()))
          PY

      - name: Migration determinism + protected columns
        run: |
          python - <<'PY'
          import sys, pathlib, tempfile
          sys.path.insert(0, ".")
          from parent_taxonomy import migrate as M

          SRC = pathlib.Path(
              "data/cdc_milestones_with_bridges_family_cleaned_final_app_ready.xlsx"
          )
          before = M.sha256_of(SRC)
          with tempfile.TemporaryDirectory() as td:
              cand = pathlib.Path(td) / "candidate.xlsx"
              report = M.migrate(SRC, cand)
              assert report.source_rows == report.candidate_rows == 369
              assert report.protected_columns_identical is True
              assert M.verify_candidate(SRC, cand) is True
          assert M.sha256_of(SRC) == before == M.SOURCE_SHA256, "source mutated"
          print("migration OK: 369 -> 369, 10 protected columns identical, source intact")
          PY

  app-consumers:
    name: Parent 2.4 app-consumer gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genex-parent

    # Deliberately a SEPARATE job, not extra steps on `taxonomy`.
    #
    # `taxonomy` gates the Brain and installs only pytest/pandas/openpyxl. These
    # tests exercise the FastAPI app, so they need fastapi/firebase-admin/httpx —
    # which must never enter that job. Bolting them on is exactly what broke the
    # first PARENT-0.3C freeze run: the app step failed on a missing import and,
    # being sequential, SKIPPED the regression and provenance gates behind it.
    #
    # Isolating them means a FastAPI/Firebase environment problem can no longer
    # prevent the pure Brain and regression gates from running. Both jobs must be
    # green for the freeze; neither can mask the other.
    #
    # Test-only. No GCP/Firebase auth, no secrets, no deploy, no real data —
    # firebase_admin token verification is monkeypatched by the tests themselves.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app-consumer CI dependencies
        # Exact pins with documented provenance — see the header of
        # requirements-parent24-app-ci.txt. The production manifests
        # (requirements.txt, requirements.api.txt) are NOT modified.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parent24-app-ci.txt
          pip list

      - name: Python compilation (api package + app-consumer tests)
        run: |
          python -m compileall -q api \
            tests/test_beta_access.py \
            tests/test_checkin_readiness.py

      - name: Beta access consumer (own pytest process)
        # SEPARATE INVOCATION, deliberately. This suite and
        # test_checkin_readiness both reassign the global
        # firebase_admin.auth.verify_id_token at IMPORT time with incompatible
        # fake-token maps, so whichever is imported last wins and the other gets
        # 401. Pre-existing test-harness debt, unrelated to domain vocabulary and
        # untouched by 0.3C. Running one suite per process CONTAINS it; it is not
        # a fix, and the collision stays recorded as debt.
        run: python -m pytest tests/test_beta_access.py -q

      - name: Check-in readiness consumer (own pytest process)
        # Second, independent process — see the note above.
        run: python -m pytest tests/test_checkin_readiness.py -q

  pilot-integration:
    name: October pilot PRE-PHI integration gate
    runs-on: ubuntu-latest

    # A THIRD separate job, for the same reason `app-consumers` is a second one.
    #
    # `taxonomy` runs the 296 pilot_backend security tests and installs only
    # pytest/pandas/openpyxl. Those tests assert STRUCTURALLY that pilot_backend
    # imports no auth SDK and no database driver — an assertion that proves
    # nothing in a job where firebase-admin and google-cloud-firestore are
    # installed. So the SDKs live here, with pilot_runtime, and never there.
    #
    # Sequential steps mean a failure skips everything behind it, which is how
    # the first 0.3C freeze run produced a green-looking skip. Isolation means an
    # SDK or emulator problem cannot prevent the Brain, regression and
    # app-consumer gates from running. All three jobs must be green to freeze.
    #
    # NO CREDENTIALS. The Firestore emulator authenticates nothing, the project
    # id is a fictional `demo-` name that is not a resolvable real project, and
    # no GCP/Firebase auth step exists. No deploy, no provisioning, no real data.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 21
        # The Firestore emulator is a Java program, and the current emulator
        # build REQUIRES a Java 21+ JRE — it refuses to start on 17 with:
        #   "The java executable on your PATH is not a Java 21+ JRE."
        # Pinned to a distribution and major version so the emulator runtime
        # is reproducible; 21 is the minimum the emulator accepts rather than
        # the newest available, so this pin moves only when Google's floor does.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up gcloud
        # Google's official action, used WITHOUT any auth step — the emulator
        # needs no credentials. Used rather than relying on gcloud being
        # preinstalled on the runner image, which is an image detail that can
        # change without notice and would fail this job on a Tuesday.
        uses: google-github-actions/setup-gcloud@v2

      - name: Install the Firestore emulator
        # Official Google tooling. No credentials, no project, no network
        # access to any real GCP resource.
        run: |
          gcloud --version
          gcloud components install cloud-firestore-emulator --quiet
          java -version

      - name: Install PRE-PHI integration dependencies
        # Exact pins with documented provenance — see the header of
        # pilot_runtime/requirements-integration-ci.txt. Production manifests
        # are NOT modified.
        run: |
          python -m pip install --upgrade pip
          pip install -r pilot_runtime/requirements-integration-ci.txt
          pip list

      - name: Python compilation (pilot_runtime)
        run: python -m compileall -q pilot_runtime

      - name: Structural guard — pilot_backend still imports no SDK
        # The whole reason this job exists. Re-asserted HERE, in the job where
        # the SDKs ARE installed, so the separation is proven under the
        # conditions that could break it rather than only where it is trivially
        # true.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          banned = {
              "firebase_admin", "firebase", "google", "googleapiclient",
              "requests", "httpx", "urllib3", "aiohttp",
              "firestore", "sqlalchemy", "psycopg2", "pymongo", "redis", "boto3",
          }
          offenders = []
          for path in sorted(pathlib.Path("pilot_backend").rglob("*.py")):
              if path.name.startswith("test_"):
                  continue
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".")[0] in banned:
                              offenders.append((str(path), alias.name))
                  if isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      if node.module.split(".")[0] in banned:
                          offenders.append((str(path), node.module))
          assert not offenders, f"pilot_backend imported an SDK: {offenders}"
          import firebase_admin, google.cloud.firestore  # noqa: F401
          print("SDKs are installed in this job, and pilot_backend still imports none")
          PY

      - name: Firebase Admin adapter (unit)
        run: python -m pytest pilot_runtime/tests/test_firebase_adapter.py -q

      - name: Firestore adapter (unit, fake client)
        run: python -m pytest pilot_runtime/tests/test_firestore_adapter.py -q

      - name: 0.5A Parent GCS session adapter (unit, fake client)
        # The READ-ONLY boundary onto Parent 2.3's `sessions/{uid}/{id}.json`.
        # Driven through a fake implementing the storage surface the adapter
        # touches, with documents shaped like real Parent sessions — including
        # the clinical fields — using FICTIONAL sentinels, so "no clinical
        # content crosses the boundary" is proven rather than asserted.
        run: |
          if [ -f pilot_runtime/tests/test_parent_gcs_adapter.py ]; then
            python -m pytest pilot_runtime/tests/test_parent_gcs_adapter.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: 0.5A Parent adapter writes nothing and enumerates nothing
        # Parent is the system of record for session data and the pilot must
        # never write it. Gated structurally: the capability must be absent,
        # not merely unused. `list_blobs` is banned too — an adapter that could
        # enumerate a prefix would be an oracle for which sessions exist.
        run: |
          if [ ! -f pilot_runtime/integration/parent_gcs_source.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import ast, pathlib, sys

          path = pathlib.Path("pilot_runtime/integration/parent_gcs_source.py")
          tree = ast.parse(path.read_text())
          called = {n.func.attr for n in ast.walk(tree)
                    if isinstance(n, ast.Call)
                    and isinstance(n.func, ast.Attribute)}
          banned = {"upload_from_string", "upload_from_file",
                    "upload_from_filename", "delete", "patch", "copy_blob",
                    "rewrite", "compose", "make_public", "create_bucket",
                    "list_blobs", "list_buckets"}
          present = sorted(called & banned)
          if present:
              print("the Parent adapter can mutate or enumerate:", present)
              sys.exit(1)

          operations = sorted(n.name for n in ast.walk(tree)
                              if isinstance(n, ast.FunctionDef)
                              and not n.name.startswith("_")
                              and any(isinstance(p, ast.ClassDef)
                                      for p in ast.walk(tree)))
          # Exactly one public method on the adapter class, and it is a read.
          cls = next(n for n in ast.walk(tree)
                     if isinstance(n, ast.ClassDef)
                     and n.name == "GcsParentSessionSource")
          public = sorted(n.name for n in cls.body
                          if isinstance(n, ast.FunctionDef)
                          and not n.name.startswith("_"))
          if public != ["fetch_session_facts"]:
              print("the Parent adapter gained an operation:", public)
              sys.exit(1)

          # No logger and no print: a session id must not reach a log line.
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.add((node.module or "").split(".")[0])
          if "logging" in imported:
              print("the Parent adapter constructs a logger")
              sys.exit(1)
          if "print" in {n.func.id for n in ast.walk(tree)
                         if isinstance(n, ast.Call)
                         and isinstance(n.func, ast.Name)}:
              print("the Parent adapter prints")
              sys.exit(1)

          # And Parent's own /tmp fallback is NOT mirrored: a pilot silently
          # reading sessions from local disk would be a different system of
          # record, which is an open decision in SECURITY.md.
          for module in ("pathlib", "tempfile", "shutil"):
              if module in imported:
                  print("the Parent adapter can reach local disk:", module)
                  sys.exit(1)
          print("Parent adapter: one read operation, no write, no listing, no log, no local fallback")
          PY

      - name: 0.5A ParentSessionFacts carries identity only
        # Two fields. There is nowhere for a diagnosis, concern, plan, note,
        # answer or feedback entry to go even if a later edit tried to carry
        # one — which is the structural half of "no clinical bridge in 0.5A".
        run: |
          if [ ! -f pilot_backend/integration/parent_source.py ]; then
            echo "0.5A not present on this branch — nothing to run"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pilot_backend.integration.parent_source import (
              ParentSessionFacts, ParentSessionSource)

          fields = set(ParentSessionFacts.__dataclass_fields__)
          if fields != {"session_id", "owner_uid"}:
              print("the Parent boundary widened:", sorted(fields))
              sys.exit(1)
          operations = [n for n in dir(ParentSessionSource)
                        if not n.startswith("_")]
          if operations != ["fetch_session_facts"]:
              print("the Parent port gained an operation:", operations)
              sys.exit(1)
          for forbidden in ("save", "write", "update", "delete", "create",
                            "put", "set", "patch"):
              if hasattr(ParentSessionSource, forbidden):
                  print("the Parent port can write:", forbidden)
                  sys.exit(1)
          print("ParentSessionFacts: session_id and owner_uid; the port cannot write")
          PY

      - name: Composition root
        run: python -m pytest pilot_runtime/tests/test_composition.py -q

      - name: Firestore emulator integration (REAL adapter)
        # Must EXECUTE. The suite's fixture RAISES rather than skipping when
        # the emulator is unavailable, so an absent emulator fails this job
        # instead of quietly producing a green run. A skipped emulator suite
        # is not a pass.
        run: python -m pytest pilot_runtime/tests/integration/test_firestore_emulator.py -q

      - name: Fictional PRE-PHI end-to-end (HTTP + Firestore + audit + revisions)
        run: python -m pytest pilot_runtime/tests/integration/test_e2e_pre_phi.py -q

      - name: Longitudinal identity — REAL emulator, REAL concurrency
        # The concurrency assertions here are the reason 0.4A exists. They
        # cannot run against the fake store: it is a plain dict and is not
        # thread-safe, so competing writers would prove nothing about
        # Firestore. An earlier claim-generation design passed every fake
        # test and was caught by this suite on its first real run.
        run: python -m pytest pilot_runtime/tests/integration/test_identity_emulator.py -q

      - name: Goals and monthly plans — REAL emulator, REAL concurrency
        # Two activations of the same child-month racing on a real server.
        # The same reasoning as 0.4A: the fake cannot host a race, so the
        # child-month claim is only ever proven here. Also carries the
        # activation crash-consistency fault injection — the transaction is
        # all-or-nothing and the boundary after it is forward-recoverable.
        run: python -m pytest pilot_runtime/tests/integration/test_goals_emulator.py -q

      - name: Weekly allocation and adaptation — REAL emulator, REAL concurrency
        # Two races a fake cannot host: eight threads creating cycle 1 of one
        # month, and eight allocating one cycle. Also the allocation
        # crash-consistency fault injection — every write there is a `create`,
        # so unlike 0.4C activation the whole thing is one transaction with no
        # boundary to recover across, and a crash must persist nothing.
        run: python -m pytest pilot_runtime/tests/integration/test_weekly_emulator.py -q

      - name: RTM evidence and reporting — REAL emulator, REAL concurrency
        # The period claim under genuine contention, and fault injection
        # inside the claim+record transaction. Also the suite that caught the
        # nested-array defect: Firestore refuses arrays of arrays and
        # FakeDocumentStore does not, so seven record types passed every unit
        # test while being unable to persist to a real database.
        run: python -m pytest pilot_runtime/tests/integration/test_rtm_emulator.py -q

      - name: 0.5A auth-subject uniqueness and the Parent bridge (real emulator)
        # Every CONTENTION claim 0.5A makes is made here and only here —
        # `FakeDocumentStore` is a plain dict and settles nothing about racing
        # writers. Eight-way new-subject bootstrap, eight-way legacy backfill,
        # ambiguity and provider-held refusal under contention, three fault
        # injections plus a combined fault+contention case.
        #
        # Also the suite that caught the orphan-child defect: an earlier
        # revision created the Child and the caregiver relationship before
        # acquiring the 0.4A source-link claim, so eight concurrent links left
        # seven orphan children with ACTIVE relationships — all eight visible
        # in /pilot/me/children. Every unit test passed throughout.
        run: |
          if [ -f pilot_runtime/tests/integration/test_identity_bridge_emulator.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_identity_bridge_emulator.py -q
          else
            echo "0.5A not present on this branch — nothing to run"
          fi

      - name: 0.5B provider connections and the cascade (real emulator)
        # Every CONTENTION claim 0.5B makes is made here and only here. Also
        # the suite that caught three Firestore rules the fake store permits:
        # `set()` is unavailable in a transaction, all reads must precede all
        # writes, and conflict detection covers only documents THIS
        # transaction read — the last of which made an atomic cascade still
        # lose a race it never read.
        run: |
          if [ -f pilot_runtime/tests/integration/test_provider_connection_emulator.py ]; then
            python -m pytest pilot_runtime/tests/integration/test_provider_connection_emulator.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: 0.5B emulator harness leaks no process
        # Infrastructure, not product. The emulator wrapper exec-spawns a JVM
        # that `terminate()` orphaned, and 98 of them had accumulated by 0.5A.
        # Source-level guard so the fast lane catches a revert too.
        run: |
          if [ -f pilot_runtime/tests/test_emulator_lifecycle.py ]; then
            python -m pytest pilot_runtime/tests/test_emulator_lifecycle.py -q
          else
            echo "0.5B not present on this branch — nothing to run"
          fi

      - name: Prove the emulator suites actually ran
        # Belt and braces against the one failure mode this job exists to
        # prevent: a green result produced by tests that never executed.
        # `--collect-only` counts them, and the run fails if the count is zero
        # or if any test reports as skipped.
        run: |
          python - <<'PY'
          import subprocess, sys
          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "pilot_runtime/tests/integration",
               "--collect-only", "-q"],
              capture_output=True, text=True)
          count = collected.stdout.count("::")
          # Raised 70 -> 90 by 0.4B/C, 90 -> 100 by 0.4D/E, 100 -> 110 by
          # 0.4F/G, 110 -> 130 by 0.5A, and 130 -> 148 by 0.5B (which adds 15
          # provider-connection tests; local collection is 153). A floor that
          # never moves stops noticing when a suite silently stops being
          # collected.
          assert count >= 148, f"expected the integration suites to collect >=148 tests, got {count}"
          run = subprocess.run(
              [sys.executable, "-m", "pytest", "pilot_runtime/tests/integration",
               "-q", "-rs"],
              capture_output=True, text=True)
          sys.stdout.write(run.stdout[-3000:])
          assert run.returncode == 0, "integration suites failed"
          assert " skipped" not in run.stdout, "no integration test may be skipped"
          print(f"integration suites executed {count} tests, zero skipped")
          PY
