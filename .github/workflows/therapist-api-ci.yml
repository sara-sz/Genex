name: Therapist API CI

# Test-only verification for the isolated therapist_api service.
# No GCP/Firebase auth, no secrets, no deploy, no Terraform, no Cloud Run,
# no Parent API access. Read-only, fictional data.

on:
  push:
    branches:
      - "feature/therapist-alpha-*"
  pull_request:
    paths:
      - "therapist_api/**"
      - ".github/workflows/therapist-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: therapist_api
    # Fictional dev environment for boot/OpenAPI (no secrets, no real projects).
    env:
      ENVIRONMENT: dev
      GCP_PROJECT_ID: genex-provider-dev-2026
      FIREBASE_PROJECT_ID: genex-provider-dev-2026
      FIRESTORE_PROJECT_ID: genex-provider-dev-2026
      REGION: us-central1
      ALLOWED_ORIGINS: https://genex-therapist-dev.lovable.app
      REGISTRATION_POLICY: open-dev
      DEV_AUTH_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python compilation
        run: python -m compileall app tests

      - name: Full therapist_api tests
        run: python -m pytest -q

      - name: Application boot test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import create_asgi_app
          client = TestClient(create_asgi_app())
          assert client.get("/health").status_code == 200, "health not served"
          r = client.get("/api/v1/me", headers={"Authorization": "Bearer dev-hannah"})
          assert r.status_code == 200, f"/api/v1/me returned {r.status_code}"
          print("boot OK: /health and /api/v1/me served")
          PY

      - name: OpenAPI generation
        run: |
          python - <<'PY'
          import json
          from app.main import create_asgi_app
          schema = create_asgi_app().openapi()
          assert schema["openapi"].startswith("3."), schema["openapi"]
          assert len(schema["paths"]) >= 15, len(schema["paths"])
          print("OpenAPI OK:", schema["info"]["title"], schema["openapi"], "paths:", len(schema["paths"]))
          PY

      - name: Import / isolation tests
        run: python -m pytest tests/test_isolation.py -q
