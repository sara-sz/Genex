# Cloud Build config for the INTERNAL BOOTSTRAP service image.
#
# A FOURTH config beside cloudbuild.yaml (served API),
# cloudbuild-generation.yaml (offline job) and cloudbuild-projection.yaml (the
# frozen A2 service). None is modified, and no tag is shared: this publishes
# `pilot-bootstrap`, never `pilot-projection` and never `pilot-api`.
#
# Same `-f` reasoning as the other two: `gcloud builds submit --tag` requires
# the Dockerfile at the context root, and these Dockerfiles live under
# pilot_runtime/ to satisfy the Parent scope guard (PARENT_ALLOWED_PREFIXES in
# genex-parent/tests/test_parent_24_integrity.py).

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/genex-pilot-staging/pilot/pilot-bootstrap
  _TAG: dev

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=pilot_runtime/deploy/Dockerfile.bootstrap
      - --tag=${_IMAGE}:${_TAG}
      - .

images:
  - ${_IMAGE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
